[project]
name = "bootstrap-infrastructure"
version = "0.1.0"
description = "Pulumi-based AWS bootstrap stack"
readme = "README.md"
requires-python = ">=3.10,<3.12"
authors = [{ name = "Bootstrap Infra Team", email = "infra@example.com" }]
dependencies = [
  "protobuf>=5.29.6,<7",
  "pulumi>=3.138,<4",
  "pulumi-aws>=7.0,<8",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
  "bandit>=1.8,<2",
  "mypy>=1.18,<2",
  "mutmut>=2.4,<3",
  "pip-audit>=2.9,<3",
  "pulumi-policy>=1.20,<2",
  "pre-commit>=3.0,<4",
  "pytest-cov>=5.0,<6",
  "pytest>=8.0,<9",
  "ruff>=0.11,<1",
  "ty>=0.0.1a18,<1",
  "types-pyyaml>=6.0.12,<7",
  "whatthepatch==0.0.6",
  "yamllint>=1.37,<2",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 88
src = ["pulumi", "policy_pack", "scripts", "tests"]
target-version = "py311"
extend-exclude = [
  "pulumi/venv",
  "pulumi/__pycache__",
  "policy_pack/__pycache__",
  "scripts/__pycache__",
  "tests/__pycache__",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["infra"]

[tool.mypy]
python_version = "3.11"
mypy_path = "pulumi"
files = ["pulumi/__main__.py", "pulumi/infra", "policy_pack", "scripts/*.py"]
pretty = true
show_error_codes = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["^pulumi/venv/", "^pulumi/__pycache__/", "^policy_pack/__pycache__/"]

[[tool.mypy.overrides]]
module = ["pulumi_policy", "pulumi_policy.*"]
ignore_missing_imports = true

[tool.ty.environment]
python-version = "3.11"
root = ["./pulumi", "./policy_pack", "./scripts"]

[tool.ty.src]
include = ["pulumi", "policy_pack", "scripts", "tests"]
exclude = [
  "pulumi/venv",
  "pulumi/__pycache__",
  "policy_pack/__pycache__",
  "scripts/__pycache__",
  "tests/__pycache__",
]

[tool.bandit]
exclude_dirs = [
  "pulumi/venv",
  "pulumi/__pycache__",
  "policy_pack/__pycache__",
  "tests",
  ".venv",
]
targets = ["pulumi", "policy_pack", "scripts"]
