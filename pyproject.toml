[project]
name = "bootstrap-infrastructure"
version = "0.1.0"
description = "Pulumi-based infrastructure template"
readme = "README.md"
requires-python = ">=3.10,<3.12"
authors = [
    { name = "Yaroslav Kravtsov", email = "kravtsov.yar@gmail.com" },
    { name = "Mykyta Mozghovoi", email = "n.mozgowoi2017@gmail.com" },
]
dependencies = [
    "pulumi>=3.200.0,<4",
    "pulumi-aws>=7.0,<8",
    "pulumi-policy>=1.20.0,<2",
    "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.8,<2",
    "cyclonedx-bom>=5,<6",
    "coverage[toml]>=7.6,<8",
    "deptry>=0.23,<0.24",
    "docstr-coverage>=2.3,<3",
    "import-linter>=2.4,<3",
    "jsonschema>=4.25,<5",
    "mutmut>=2.4,<3",
    "pip-audit>=2.9,<3",
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<6",
    "radon>=5.1,<6",
    "ruff>=0.15.6,<1",
    "tomli>=2.0,<3",
    "ty>=0.0.21,<0.1",
    "vulture>=2.11,<3",
    "wily>=1.25,<2",
    "xenon>=0.9,<1",
    "yamllint>=1.35,<2",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["C90", "E", "F", "I"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.bandit]
exclude_dirs = ["tests"]
targets = ["pulumi", "policy", "scripts"]

[tool.deptry]
extend_exclude = [".artifacts", ".pulumi-backend"]
ignore_notebooks = true
known_first_party = [
    "_github_environment_controls",
    "_github_evidence_environment",
    "_github_repository_controls",
    "_pulumi_command_support",
    "_pulumi_stack_config",
    "governance_paths",
    "pulumi_command_preflight",
    "pulumi_pr_comment",
    "_script_support",
    "_well_architected_alert_route_observation",
    "_well_architected_aws_alert_route",
    "_well_architected_aws_cloudtrail",
    "_well_architected_aws_cost_evidence",
    "_well_architected_aws_iam_access",
    "_well_architected_aws_metadata",
    "_well_architected_dependabot_evidence",
    "_well_architected_env",
    "_well_architected_evidence_common",
    "_well_architected_github_environment",
    "_well_architected_github_local_state",
    "_well_architected_github_pr_checks",
    "_well_architected_github_repository_evidence",
    "_well_architected_github_review_threads",
    "_well_architected_github_rollup",
    "_well_architected_markdown",
    "_well_architected_publisher",
    "_well_architected_publisher_app",
    "_well_architected_publisher_artifacts",
    "_well_architected_recording",
    "_well_architected_repository_fanout_evidence",
    "_well_architected_restore_evidence",
    "_well_architected_scoring",
    "_well_architected_security_account_evidence",
    "_well_architected_structured_evidence",
    "_well_architected_trusted_evidence",
    "app",
    "infra",
    "policy",
    "reviewed_iam",
    "validate_repository_catalogs",
]

[tool.deptry.package_module_name_map]
pyyaml = ["yaml"]
"pulumi-policy" = ["pulumi_policy"]

[tool.deptry.per_rule_ignores]
DEP001 = ["config", "guardrails", "pack"]
DEP002 = ["pulumi-aws"]
DEP004 = [
    "bandit",
    "coverage",
    "cyclonedx-bom",
    "deptry",
    "docstr-coverage",
    "import-linter",
    "jsonschema",
    "mutmut",
    "pip-audit",
    "pytest",
    "pytest-cov",
    "radon",
    "ruff",
    "ty",
    "vulture",
    "wily",
    "xenon",
    "yamllint",
]

[tool.importlinter]
root_packages = ["app", "policy", "infra"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Governance component stays isolated from the policy pack and Pulumi app layer"
type = "forbidden"
source_modules = ["infra.governance"]
forbidden_modules = ["policy", "app"]

[[tool.importlinter.contracts]]
name = "Pulumi runtime does not depend on the policy pack"
type = "forbidden"
source_modules = ["app", "infra"]
forbidden_modules = ["policy"]

[[tool.importlinter.contracts]]
name = "Policy pack stays isolated from Pulumi runtime modules"
type = "forbidden"
source_modules = ["policy"]
forbidden_modules = ["app", "infra"]

[[tool.importlinter.contracts]]
name = "Runtime guardrails stay behind the environment component"
type = "protected"
protected_modules = ["app.guardrails"]
allowed_importers = ["app.environment"]

[[tool.importlinter.contracts]]
name = "Pulumi app layering remains one-way"
type = "layers"
containers = ["app"]
layers = ["environment", "guardrails"]

[[tool.importlinter.contracts]]
name = "Policy pack stays behind the policy entrypoint"
type = "protected"
protected_modules = ["policy.pack"]
allowed_importers = ["policy.__main__"]

[[tool.importlinter.contracts]]
name = "Policy guardrails stay behind the pack surface"
type = "protected"
protected_modules = ["policy.guardrails"]
allowed_importers = ["policy.pack"]

[[tool.importlinter.contracts]]
name = "Policy config stays behind the pack and guardrails"
type = "protected"
protected_modules = ["policy.config"]
allowed_importers = ["policy.pack", "policy.guardrails"]

[[tool.importlinter.contracts]]
name = "Policy layering remains one-way"
type = "layers"
containers = ["policy"]
layers = ["pack", "guardrails", "reviewed_iam", "config"]

[[tool.importlinter.contracts]]
name = "Runtime guardrails stay free of Pulumi SDK bindings"
type = "forbidden"
source_modules = ["app.guardrails"]
forbidden_modules = ["pulumi", "pulumi_policy"]

[[tool.importlinter.contracts]]
name = "Policy helpers stay free of Pulumi runtime bindings"
type = "forbidden"
source_modules = ["policy.config", "policy.guardrails"]
forbidden_modules = ["pulumi", "pulumi_policy"]

[tool.vulture]
exclude = ["tests/", ".artifacts/", ".pulumi-backend/"]
min_confidence = 80
paths = ["pulumi/app", "pulumi/infra", "policy", "scripts"]
