name: CLI testing

on:
  push:
    branches:
      - main
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  bats_tests:
    runs-on: ubuntu-latest
    name: Run Bats Tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run Bats suite
        run: make test-bats
