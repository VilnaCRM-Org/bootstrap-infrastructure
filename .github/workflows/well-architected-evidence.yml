name: Well-Architected Evidence

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 6 9 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  evidence_mode:
    name: Evidence Mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      privileged: ${{ steps.evidence_mode.outputs.privileged }}
    env:
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      GITHUB_REPOSITORY_NAME: ${{ github.repository }}
    steps:
      - name: Select evidence mode
        id: evidence_mode
        run: |
          privileged=true
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && \
            "${GITHUB_HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY_NAME}" ]]; then
            privileged=false
            echo "::notice::Fork pull request detected; running without AWS credentials."
          fi
          echo "privileged=${privileged}" >> "${GITHUB_OUTPUT}"

  test_account_evidence:
    name: Test Account Evidence (Advisory)
    if: ${{ needs.evidence_mode.outputs.privileged == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - evidence_mode
    timeout-minutes: 20
    environment: test
    permissions:
      contents: read
      id-token: write
      pull-requests: read
      security-events: read
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      AWS_PREVIEW_ROLE_ARN: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
      OPERATIONS_TOPIC_ARN: ${{ vars.OPERATIONS_TOPIC_ARN || 'arn:aws:sns:eu-central-1:891377212104:bootstrap-test-operations' }}
      OPERATIONS_CLOUDTRAIL_NAME: ${{ vars.OPERATIONS_CLOUDTRAIL_NAME || 'bootstrap-test-management-events' }}
      RESTORE_DRILL_EVIDENCE: specs/issue-17-well-architected-5-of-5/restore-drill-evidence-2026-04-27.json
      QUESTION_MATRIX_EVIDENCE: specs/issue-17-well-architected-5-of-5/question-matrix-evidence-2026-05-09.json
      EXTERNAL_CONTROL_EVIDENCE: specs/issue-17-well-architected-5-of-5/external-control-evidence-2026-05-09.json
      DEPENDABOT_EXCEPTION_EVIDENCE: ${{ vars.DEPENDABOT_EXCEPTION_EVIDENCE }}
      ALERT_ROUTE_OBSERVATION_EVIDENCE: ${{ vars.ALERT_ROUTE_OBSERVATION_EVIDENCE }}
      SECURITY_ACCOUNT_ATTESTATION_EVIDENCE: ${{ vars.SECURITY_ACCOUNT_ATTESTATION_EVIDENCE }}
      PRODUCTION_DR_OWNER_EVIDENCE: ${{ vars.PRODUCTION_DR_OWNER_EVIDENCE }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      WELL_ARCHITECTED_CURRENT_CHECK_NAME: Test Account Evidence (Advisory)
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Validate evidence prerequisites
        run: |
          missing=()
          for name in \
            AWS_ACCOUNT_ID \
            AWS_PREVIEW_ROLE_ARN \
            OPERATIONS_TOPIC_ARN \
            OPERATIONS_CLOUDTRAIL_NAME \
            RESTORE_DRILL_EVIDENCE \
            QUESTION_MATRIX_EVIDENCE \
            EXTERNAL_CONTROL_EVIDENCE; do
            if [[ -z "${!name}" ]]; then
              missing+=("${name}")
            fi
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            printf 'error: Well-Architected evidence is missing %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if [[ ! "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]; then
            echo "error: AWS_ACCOUNT_ID must be a 12-digit AWS account ID." >&2
            exit 1
          fi
          if [[ "${OPERATIONS_TOPIC_ARN}" != arn:aws:sns:* ]]; then
            echo "error: OPERATIONS_TOPIC_ARN must be an SNS topic ARN." >&2
            exit 1
          fi
          for path in \
            "${RESTORE_DRILL_EVIDENCE}" \
            "${QUESTION_MATRIX_EVIDENCE}" \
            "${EXTERNAL_CONTROL_EVIDENCE}"; do
            if [[ ! -f "${path}" ]]; then
              printf 'error: evidence file is missing: %s\n' "${path}" >&2
              exit 1
            fi
          done

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: ${{ env.AWS_PREVIEW_ROLE_ARN }}
          role-session-name: gha-wa-evidence-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Emit evidence context
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "GitHub environment: test"
          echo "Commit SHA: ${GITHUB_SHA}"
          echo "AWS account ID: ${account_id}"
          echo "AWS region: ${AWS_REGION}"
          echo "Role purpose: Well-Architected evidence"

      - name: Install uv for host-side collector
        run: python3 -m pip install --user 'uv==0.9.21'

      - name: Wait for PR checks before evidence snapshot
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          expected_checks=(
            "Actionlint"
            "Architecture"
            "Bandit"
            "CodeQL"
            "CodeQL (actions)"
            "CodeQL (python)"
            "CodeRabbit"
            "Coverage"
            "Dependency Audit"
            "Dependency Hygiene"
            "Dependency Review"
            "Destructive Diff Gate"
            "Evidence Mode"
            "Hadolint"
            "IAM Validation"
            "Integration"
            "Local Battery"
            "Maintainability"
            "Mutation"
            "Policy"
            "Preview"
            "Preview Mode"
            "Ruff"
            "Run Bats Tests"
            "Secrets Scan"
            "Structural"
            "Ty"
            "Unit"
            "Yamllint"
            "qlty check"
            "qlty fmt"
          )
          deadline=$((SECONDS + 600))
          while true; do
            rollup="$(gh pr view "${PR_NUMBER}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json statusCheckRollup)"
            missing=()
            pending=()
            failing=()
            for check_name in "${expected_checks[@]}"; do
              state="$(jq -r --arg name "${check_name}" '
                [
                  .statusCheckRollup[]
                  | select((.name // .context) == $name)
                  | if .__typename == "StatusContext" then
                      .state
                    elif .status == "COMPLETED" then
                      (.conclusion // "UNKNOWN")
                    else
                      (.status // "UNKNOWN")
                    end
                ][-1] // ""
              ' <<< "${rollup}")"
              if [[ -z "${state}" ]]; then
                missing+=("${check_name}")
              elif [[ "${state}" == "SUCCESS" ]]; then
                continue
              elif [[ "${state}" =~ ^(PENDING|QUEUED|IN_PROGRESS|WAITING|REQUESTED)$ ]]; then
                pending+=("${check_name}:${state}")
              else
                failing+=("${check_name}:${state}")
              fi
            done
            if [[ "${#missing[@]}" -eq 0 && "${#pending[@]}" -eq 0 ]]; then
              if [[ "${#failing[@]}" -gt 0 ]]; then
                printf '::notice::PR checks reached terminal non-success states: %s\n' \
                  "${failing[*]}"
              else
                echo "PR checks are settled for the evidence snapshot."
              fi
              break
            fi
            if [[ "${SECONDS}" -ge "${deadline}" ]]; then
              printf '::notice::Timed out waiting for PR checks; missing: %s; pending: %s\n' \
                "${missing[*]:-none}" \
                "${pending[*]:-none}"
              break
            fi
            printf 'Waiting for PR checks before evidence snapshot; missing: %s; pending: %s\n' \
              "${missing[*]:-none}" \
              "${pending[*]:-none}"
            sleep 20
          done

      - name: Collect Well-Architected evidence
        id: collector
        run: |
          export REPO_PYTHON="${HOME}/.local/bin/uv run python"
          set +e
          make report-well-architected-evidence
          collector_status=$?
          set -e
          echo "exit_code=${collector_status}" >> "${GITHUB_OUTPUT}"
          make verify-well-architected-questions
          make report-well-architected-closeout
          if [[ -f .artifacts/well-architected/evidence.md ]]; then
            cat .artifacts/well-architected/evidence.md >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ -f .artifacts/well-architected/owner-closeout-bundle.md ]]; then
            {
              echo
              echo "## Well-Architected Closeout Audit"
              echo
              cat .artifacts/well-architected/owner-closeout-bundle.md
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          if [[ "${collector_status}" -eq 0 ]]; then
            echo "::notice::Well-Architected evidence passed all readiness gates."
          else
            echo "::notice::Well-Architected evidence reported blockers; see uploaded artifacts."
          fi

      - name: Upload Well-Architected evidence artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: well-architected-evidence
          path: .artifacts/well-architected
          retention-days: 90

      - name: Enforce Well-Architected evidence when enabled
        if: ${{ github.event_name != 'schedule' && vars.WELL_ARCHITECTED_EVIDENCE_ENFORCE == 'true' && steps.collector.outputs.exit_code != '0' }}
        run: |
          echo "error: Well-Architected evidence enforcement is enabled and blockers remain." >&2
          exit 1

  unprivileged_evidence:
    name: Evidence (Unprivileged)
    if: ${{ needs.evidence_mode.outputs.privileged != 'true' }}
    runs-on: ubuntu-latest
    needs:
      - evidence_mode
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Record skipped AWS evidence
        run: |
          {
            echo "# Well-Architected Evidence"
            echo
            echo "Fork pull request detected. AWS-backed evidence collection was skipped because credentials are unavailable to untrusted forks."
          } >> "${GITHUB_STEP_SUMMARY}"
