name: Well-Architected Data Validation

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 6 9 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  evidence_data:
    name: Well-Architected Data Validation (Advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned test runtime without cloud credentials
        run: python3 -m pip install --user 'uv==0.9.21'
      - name: Validate selected committed evidence and receipt hashes
        run: |
          env -i HOME="$HOME" PATH="$PATH" \
            "$HOME/.local/bin/uv" run --frozen pytest --no-cov -q \
            tests/unit/test_well_architected_evidence_data.py
      - name: State advisory scope
        run: |
          {
            echo 'Selected evidence schema and receipt integrity only.'
            echo 'Unresolved questions and owner decisions remain visible in the records.'
            echo 'This advisory job does not grant Well-Architected acceptance.'
            echo 'The protected trusted publisher alone emits App-pinned Test Account Evidence after the complete live collector.'
          } >> "$GITHUB_STEP_SUMMARY"
