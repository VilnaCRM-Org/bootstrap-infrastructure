name: Pulumi E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  e2e:
    if: >-
      ${{
        vars.PULUMI_TEST_ROLE_ARN != '' &&
        vars.PULUMI_TEST_SECRETS_PROVIDER != '' &&
        (
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        )
      }}
    name: E2E
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-central-1
      PULUMI_E2E_SECRETS_PROVIDER: ${{ vars.PULUMI_TEST_SECRETS_PROVIDER }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Match container user to runner
        run: |
          {
            echo "UID=$(id -u)"
            echo "GID=$(id -g)"
            echo "USER=$(id -un)"
          } >> "$GITHUB_ENV"

      - name: Build test container
        run: docker compose build pulumi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.PULUMI_TEST_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run e2e suite
        run: make test-e2e
