# Activate only after independent seed enrollment, ownership reconciliation and
# retirement of legacy credentialed writers have been verified.
name: Pulumi PR Command Runner
'on':
  repository_dispatch:
    types:
      - pulumi-pr-command
concurrency:
  group: pulumi-command-${{ github.event.client_payload.pull_request_number }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
permissions:
  contents: read
env:
  DEPLOYMENT_COORDINATOR_MODE: ${{ vars.DEPLOYMENT_COORDINATOR_MODE }}
jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      statuses: write
    outputs:
      execution_ready: ${{ steps.accept.outputs.execution_ready }}
      has_deployment_scopes: ${{ steps.accept.outputs.has_deployment_scopes }}
      command: ${{ steps.accept.outputs.command }}
      head_sha: ${{ steps.accept.outputs.head_sha }}
      base_sha: ${{ steps.accept.outputs.base_sha }}
      pull_request_number: ${{ steps.accept.outputs.pull_request_number }}
      target_environment: ${{ steps.accept.outputs.target_environment }}
      contract_file_sha256: ${{ steps.accept.outputs.contract_file_sha256 }}
      selection_digest: ${{ steps.accept.outputs.selection_digest }}
      contract_digest: ${{ steps.accept.outputs.contract_digest }}
      operator_selected: ${{ steps.accept.outputs.operator_selected }}
      governance_selected: ${{ steps.accept.outputs.governance_selected }}
      platform_selected: ${{ steps.accept.outputs.platform_selected }}
      scaffold_validation: ${{ steps.accept.outputs.scaffold_validation }}
      execution_validation: ${{ steps.accept.outputs.execution_validation }}
      catalog_validation: ${{ steps.accept.outputs.catalog_validation }}
      feedback_pull_request_number: ${{ steps.accept.outputs.feedback_pull_request_number }}
      feedback_head_sha: ${{ steps.accept.outputs.feedback_head_sha }}
      feedback_display_command: ${{ steps.accept.outputs.feedback_display_command }}
      artifact_id: ${{ steps.contract.outputs.artifact-id }}
      artifact_sha256: ${{ steps.contract.outputs.artifact-digest }}
    steps:
      - name: Check out immutable trusted controller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: .trusted
          persist-credentials: false
      - name: Authenticate, select and claim the original request once
        id: accept
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_PULL_REQUEST_NUMBER: ${{ github.event.client_payload.pull_request_number }}
          REQUEST_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          REQUEST_COMMENT_ID: ${{ github.event.client_payload.comment_id }}
          REQUEST_SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
          REQUEST_COMMAND: ${{ github.event.client_payload.command }}
          REQUEST_TARGET_ENVIRONMENT: ${{ github.event.client_payload.target_environment }}
        run: |
          python3 -I -c \
            'import runpy, sys; sys.path.insert(0, sys.argv.pop(1)); runpy.run_module("deployment_controller_runtime", run_name="__main__")' \
            "${GITHUB_WORKSPACE}/.trusted/scripts" accept
      - name: Upload the admitted canonical contract
        id: contract
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deployment-selection-${{ github.run_id }}-1
          path: .trusted/.artifacts/deployment-selection/contract.json
          if-no-files-found: error
          retention-days: 7
  validate_inputs:
    name: validate_inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - preflight
    if: ${{ needs.preflight.result == 'success' && needs.preflight.outputs.execution_ready == 'true' }}
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out immutable trusted controller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: .trusted
          persist-credentials: false
      - name: Check out admitted input revision and exact base history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Install supported Python for trusted input preparation
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Authenticate and prepare fixed input checks
        id: prepare_inputs
        env:
          GH_TOKEN: ${{ github.token }}
          CONTRACT_ARTIFACT_ID: ${{ needs.preflight.outputs.artifact_id }}
          CONTRACT_ARTIFACT_SHA256: ${{ needs.preflight.outputs.artifact_sha256 }}
          CONTRACT_SHA256: ${{ needs.preflight.outputs.contract_file_sha256 }}
        run: |
          python3 -I "${GITHUB_WORKSPACE}/.trusted/scripts/deployment_input_validation.py" prepare \
            --artifact-id "${CONTRACT_ARTIFACT_ID}" \
            --artifact-sha256 "${CONTRACT_ARTIFACT_SHA256}" \
            --contract-sha256 "${CONTRACT_SHA256}" \
            --source "${GITHUB_WORKSPACE}/source" \
            --plan-path "${RUNNER_TEMP}/deployment-input-plan.json" \
            --output "${GITHUB_OUTPUT}"
      - name: Execute authenticated checks in an isolated offline container
        env:
          VALIDATION_PLAN_SHA256: ${{ steps.prepare_inputs.outputs.plan_sha256 }}
        run: |
          python3 -I "${GITHUB_WORKSPACE}/.trusted/scripts/deployment_input_validation.py" run \
            --plan-path "${RUNNER_TEMP}/deployment-input-plan.json" \
            --plan-sha256 "${VALIDATION_PLAN_SHA256}"
  operator_test:
    name: operator_test
    needs:
      - preflight
      - validate_inputs
    if: |-
      ${{ always() &&
      !cancelled() &&
      needs.preflight.result == 'success' && needs.preflight.outputs.execution_ready == 'true' && needs.validate_inputs.result == 'success' &&
      needs.preflight.outputs.operator_selected == 'true' }}
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/pulumi-operator-account.yml
    with:
      account: test
      artifact_id: ${{ needs.preflight.outputs.artifact_id }}
      artifact_sha256: ${{ needs.preflight.outputs.artifact_sha256 }}
      contract_sha256: ${{ needs.preflight.outputs.contract_file_sha256 }}
  governance_test:
    name: governance_test
    needs:
      - preflight
      - validate_inputs
      - operator_test
    if: |-
      ${{ always() &&
      !cancelled() &&
      needs.preflight.result == 'success' && needs.preflight.outputs.execution_ready == 'true' && needs.validate_inputs.result == 'success' &&
      needs.preflight.outputs.governance_selected == 'true' &&
      ((needs.preflight.outputs.operator_selected == 'false' && needs.operator_test.result == 'skipped') || (needs.preflight.outputs.operator_selected == 'true' && needs.operator_test.result == 'success')) }}
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/pulumi-governance-account.yml
    with:
      account: test
      artifact_id: ${{ needs.preflight.outputs.artifact_id }}
      artifact_sha256: ${{ needs.preflight.outputs.artifact_sha256 }}
      contract_sha256: ${{ needs.preflight.outputs.contract_file_sha256 }}
  platform_test:
    name: platform_test
    needs:
      - preflight
      - validate_inputs
      - operator_test
      - governance_test
    if: |-
      ${{ always() &&
      !cancelled() &&
      needs.preflight.result == 'success' && needs.preflight.outputs.execution_ready == 'true' && needs.validate_inputs.result == 'success' &&
      needs.preflight.outputs.platform_selected == 'true' &&
      ((needs.preflight.outputs.operator_selected == 'false' && needs.operator_test.result == 'skipped') || (needs.preflight.outputs.operator_selected == 'true' && needs.operator_test.result == 'success')) &&
      ((needs.preflight.outputs.governance_selected == 'false' && needs.governance_test.result == 'skipped') || (needs.preflight.outputs.governance_selected == 'true' && needs.governance_test.result == 'success')) }}
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/pulumi-platform-account.yml
    with:
      account: test
      artifact_id: ${{ needs.preflight.outputs.artifact_id }}
      artifact_sha256: ${{ needs.preflight.outputs.artifact_sha256 }}
      contract_sha256: ${{ needs.preflight.outputs.contract_file_sha256 }}
  whole_test:
    name: whole_test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - preflight
      - validate_inputs
      - operator_test
      - governance_test
      - platform_test
    if: ${{ always() && needs.preflight.result == 'success' && needs.preflight.outputs.execution_ready
      == 'true' && needs.validate_inputs.result == 'success' }}
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    outputs:
      barrier_digest: ${{ steps.barrier.outputs.barrier_digest }}
      barrier_file_sha256: ${{ steps.barrier.outputs.barrier_file_sha256 }}
      completion_kind: ${{ steps.barrier.outputs.completion_kind }}
      artifact_id: ${{ steps.proof.outputs.artifact-id }}
      artifact_sha256: ${{ steps.proof.outputs.artifact-digest }}
      environment: ${{ steps.barrier.outputs.environment }}
      selection_digest: ${{ steps.barrier.outputs.selection_digest }}
      contract_digest: ${{ steps.barrier.outputs.contract_digest }}
    steps:
      - name: Check out immutable trusted controller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: .trusted
          persist-credentials: false
      - name: Authenticate actual account jobs and complete receipt evidence
        id: barrier
        env:
          GH_TOKEN: ${{ github.token }}
          CONTRACT_ARTIFACT_ID: ${{ needs.preflight.outputs.artifact_id }}
          CONTRACT_ARTIFACT_SHA256: ${{ needs.preflight.outputs.artifact_sha256 }}
          CONTRACT_SHA256: ${{ needs.preflight.outputs.contract_file_sha256 }}
          BARRIER_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -I "${GITHUB_WORKSPACE}/.trusted/scripts/deployment_account_barrier.py" \
            --artifact-id "${CONTRACT_ARTIFACT_ID}" \
            --artifact-sha256 "${CONTRACT_ARTIFACT_SHA256}" \
            --contract-sha256 "${CONTRACT_SHA256}" \
            --environment test \
            --barrier-path .artifacts/deployment-barrier/test.json \
            --output "${GITHUB_OUTPUT}"
      - name: Upload verified account barrier evidence
        id: proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deployment-barrier-${{ github.run_id }}-1-test
          path: .artifacts/deployment-barrier/test.json
          if-no-files-found: error
          retention-days: 7
  operator_prod:
    name: operator_prod
    needs:
      - preflight
      - validate_inputs
      - whole_test
    if: |-
      ${{ always() &&
      !cancelled() &&
      needs.preflight.result == 'success' && needs.preflight.outputs.execution_ready == 'true' && needs.validate_inputs.result == 'success' &&
      needs.preflight.outputs.target_environment == 'prod' &&
      needs.whole_test.result == 'success' &&
      needs.whole_test.outputs.artifact_id != '' &&
      needs.whole_test.outputs.artifact_sha256 != '' &&
      needs.preflight.outputs.operator_selected == 'true' }}
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/pulumi-operator-account.yml
    with:
      account: prod
      artifact_id: ${{ needs.preflight.outputs.artifact_id }}
      artifact_sha256: ${{ needs.preflight.outputs.artifact_sha256 }}
      contract_sha256: ${{ needs.preflight.outputs.contract_file_sha256 }}
  governance_prod:
    name: governance_prod
    needs:
      - preflight
      - validate_inputs
      - whole_test
      - operator_prod
    if: |-
      ${{ always() &&
      !cancelled() &&
      needs.preflight.result == 'success' && needs.preflight.outputs.execution_ready == 'true' && needs.validate_inputs.result == 'success' &&
      needs.preflight.outputs.target_environment == 'prod' &&
      needs.whole_test.result == 'success' &&
      needs.whole_test.outputs.artifact_id != '' &&
      needs.whole_test.outputs.artifact_sha256 != '' &&
      needs.preflight.outputs.governance_selected == 'true' &&
      ((needs.preflight.outputs.operator_selected == 'false' && needs.operator_prod.result == 'skipped') || (needs.preflight.outputs.operator_selected == 'true' && needs.operator_prod.result == 'success')) }}
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/pulumi-governance-account.yml
    with:
      account: prod
      artifact_id: ${{ needs.preflight.outputs.artifact_id }}
      artifact_sha256: ${{ needs.preflight.outputs.artifact_sha256 }}
      contract_sha256: ${{ needs.preflight.outputs.contract_file_sha256 }}
  platform_prod:
    name: platform_prod
    needs:
      - preflight
      - validate_inputs
      - whole_test
      - operator_prod
      - governance_prod
    if: |-
      ${{ always() &&
      !cancelled() &&
      needs.preflight.result == 'success' && needs.preflight.outputs.execution_ready == 'true' && needs.validate_inputs.result == 'success' &&
      needs.preflight.outputs.target_environment == 'prod' &&
      needs.whole_test.result == 'success' &&
      needs.whole_test.outputs.artifact_id != '' &&
      needs.whole_test.outputs.artifact_sha256 != '' &&
      needs.preflight.outputs.platform_selected == 'true' &&
      ((needs.preflight.outputs.operator_selected == 'false' && needs.operator_prod.result == 'skipped') || (needs.preflight.outputs.operator_selected == 'true' && needs.operator_prod.result == 'success')) &&
      ((needs.preflight.outputs.governance_selected == 'false' && needs.governance_prod.result == 'skipped') || (needs.preflight.outputs.governance_selected == 'true' && needs.governance_prod.result == 'success')) }}
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      id-token: write
    uses: ./.github/workflows/pulumi-platform-account.yml
    with:
      account: prod
      artifact_id: ${{ needs.preflight.outputs.artifact_id }}
      artifact_sha256: ${{ needs.preflight.outputs.artifact_sha256 }}
      contract_sha256: ${{ needs.preflight.outputs.contract_file_sha256 }}
  whole_prod:
    name: whole_prod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - preflight
      - validate_inputs
      - operator_test
      - governance_test
      - platform_test
      - whole_test
      - operator_prod
      - governance_prod
      - platform_prod
    if: ${{ always() && needs.preflight.result == 'success' && needs.preflight.outputs.execution_ready
      == 'true' && needs.validate_inputs.result == 'success' && needs.preflight.outputs.target_environment
      == 'prod' && needs.whole_test.result == 'success' }}
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    outputs:
      barrier_digest: ${{ steps.barrier.outputs.barrier_digest }}
      barrier_file_sha256: ${{ steps.barrier.outputs.barrier_file_sha256 }}
      completion_kind: ${{ steps.barrier.outputs.completion_kind }}
      artifact_id: ${{ steps.proof.outputs.artifact-id }}
      artifact_sha256: ${{ steps.proof.outputs.artifact-digest }}
      environment: ${{ steps.barrier.outputs.environment }}
      selection_digest: ${{ steps.barrier.outputs.selection_digest }}
      contract_digest: ${{ steps.barrier.outputs.contract_digest }}
    steps:
      - name: Check out immutable trusted controller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: .trusted
          persist-credentials: false
      - name: Authenticate actual account jobs and complete receipt evidence
        id: barrier
        env:
          GH_TOKEN: ${{ github.token }}
          CONTRACT_ARTIFACT_ID: ${{ needs.preflight.outputs.artifact_id }}
          CONTRACT_ARTIFACT_SHA256: ${{ needs.preflight.outputs.artifact_sha256 }}
          CONTRACT_SHA256: ${{ needs.preflight.outputs.contract_file_sha256 }}
          BARRIER_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -I "${GITHUB_WORKSPACE}/.trusted/scripts/deployment_account_barrier.py" \
            --artifact-id "${CONTRACT_ARTIFACT_ID}" \
            --artifact-sha256 "${CONTRACT_ARTIFACT_SHA256}" \
            --contract-sha256 "${CONTRACT_SHA256}" \
            --environment prod \
            --barrier-path .artifacts/deployment-barrier/prod.json \
            --output "${GITHUB_OUTPUT}"
      - name: Upload verified account barrier evidence
        id: proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deployment-barrier-${{ github.run_id }}-1-prod
          path: .artifacts/deployment-barrier/prod.json
          if-no-files-found: error
          retention-days: 7
  prepare_promotion:
    name: prepare_promotion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - preflight
      - validate_inputs
      - operator_test
      - governance_test
      - platform_test
      - whole_test
      - operator_prod
      - governance_prod
      - platform_prod
      - whole_prod
    if: |-
      ${{ always() && !cancelled() &&
      needs.preflight.result == 'success' && needs.preflight.outputs.execution_ready == 'true' &&
      needs.preflight.outputs.command == 'up' && needs.preflight.outputs.target_environment == 'prod' &&
      needs.preflight.outputs.has_deployment_scopes == 'true' &&
      needs.validate_inputs.result == 'success' &&
      needs.whole_test.result == 'success' && needs.whole_test.outputs.completion_kind == 'apply-drift' &&
      needs.whole_prod.result == 'success' && needs.whole_prod.outputs.completion_kind == 'apply-drift' }}
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
    outputs:
      proof_digest: ${{ steps.prepare.outputs.proof_digest }}
      proof_file_sha256: ${{ steps.prepare.outputs.proof_file_sha256 }}
      head_sha: ${{ steps.prepare.outputs.head_sha }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      selection_digest: ${{ steps.prepare.outputs.selection_digest }}
      contract_digest: ${{ steps.prepare.outputs.contract_digest }}
      artifact_id: ${{ steps.proof.outputs.artifact-id }}
      artifact_sha256: ${{ steps.proof.outputs.artifact-digest }}
    steps:
      - name: Check out immutable trusted controller
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: .trusted
          persist-credentials: false
      - name: Reauthenticate original receipt and job evidence for both accounts
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          CONTRACT_ARTIFACT_ID: ${{ needs.preflight.outputs.artifact_id }}
          CONTRACT_ARTIFACT_SHA256: ${{ needs.preflight.outputs.artifact_sha256 }}
          CONTRACT_SHA256: ${{ needs.preflight.outputs.contract_file_sha256 }}
          PROMOTION_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -I "${GITHUB_WORKSPACE}/.trusted/scripts/deployment_promotion_proof.py" prepare \
            --artifact-id "${CONTRACT_ARTIFACT_ID}" \
            --artifact-sha256 "${CONTRACT_ARTIFACT_SHA256}" \
            --contract-sha256 "${CONTRACT_SHA256}" \
            --proof-path .artifacts/deployment-promotion/proof.json \
            --output "${GITHUB_OUTPUT}"
      - name: Upload prepared aggregate evidence without publishing success
        id: proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deployment-promotion-${{ github.run_id }}-1
          path: .artifacts/deployment-promotion/proof.json
          if-no-files-found: error
          retention-days: 7
  publish_promotion:
    name: publish_promotion
    concurrency:
      group: promotion-status-${{ needs.preflight.outputs.pull_request_number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: governance-evidence
    needs:
      - preflight
      - validate_inputs
      - operator_test
      - governance_test
      - platform_test
      - whole_test
      - operator_prod
      - governance_prod
      - platform_prod
      - whole_prod
      - prepare_promotion
    if: |-
      ${{ always() && !cancelled() &&
      github.repository == 'VilnaCRM-Org/bootstrap-infrastructure' &&
      github.ref == 'refs/heads/main' && github.event_name == 'repository_dispatch' &&
      needs.preflight.result == 'success' && needs.preflight.outputs.execution_ready == 'true' &&
      needs.preflight.outputs.command == 'up' && needs.preflight.outputs.target_environment == 'prod' &&
      needs.preflight.outputs.has_deployment_scopes == 'true' &&
      needs.validate_inputs.result == 'success' &&
      needs.whole_test.result == 'success' && needs.whole_test.outputs.completion_kind == 'apply-drift' &&
      needs.whole_prod.result == 'success' && needs.whole_prod.outputs.completion_kind == 'apply-drift' &&
      needs.prepare_promotion.result == 'success' &&
      needs.prepare_promotion.outputs.artifact_id != '' &&
      needs.prepare_promotion.outputs.artifact_sha256 != '' &&
      needs.prepare_promotion.outputs.proof_file_sha256 != '' }}
    permissions:
      contents: read
    outputs:
      published: ${{ steps.publish.outputs.published }}
      head_sha: ${{ steps.publish.outputs.head_sha }}
      proof_digest: ${{ steps.publish.outputs.proof_digest }}
      status_id: ${{ steps.publish.outputs.status_id }}
    steps:
      - name: Check out immutable trusted publisher
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: .trusted
          persist-credentials: false
      - name: Create repository-scoped dedicated promotion App token
        id: promotion_app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.GOVERNANCE_PROMOTION_APP_ID }}
          private-key: ${{ secrets.GOVERNANCE_PROMOTION_APP_PRIVATE_KEY }}
          owner: VilnaCRM-Org
          repositories: bootstrap-infrastructure
          permission-statuses: write
          permission-deployments: write
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read
      - name: Revalidate and publish aggregate proof with verified readback
        id: publish
        env:
          GH_TOKEN: ${{ steps.promotion_app.outputs.token }}
          CONTRACT_ARTIFACT_ID: ${{ needs.preflight.outputs.artifact_id }}
          CONTRACT_ARTIFACT_SHA256: ${{ needs.preflight.outputs.artifact_sha256 }}
          CONTRACT_SHA256: ${{ needs.preflight.outputs.contract_file_sha256 }}
          PROOF_ARTIFACT_ID: ${{ needs.prepare_promotion.outputs.artifact_id }}
          PROOF_ARTIFACT_SHA256: ${{ needs.prepare_promotion.outputs.artifact_sha256 }}
          PROOF_FILE_SHA256: ${{ needs.prepare_promotion.outputs.proof_file_sha256 }}
          ALL_PROMOTION_NEEDS: ${{ toJSON(needs) }}
        run: |
          PROMOTION_NEEDS="$(jq -ce \
            '{preflight, validate_inputs, operator_test, governance_test, platform_test, whole_test, operator_prod, governance_prod, platform_prod, whole_prod}' \
            <<< "${ALL_PROMOTION_NEEDS}")"
          export PROMOTION_NEEDS
          python3 -I "${GITHUB_WORKSPACE}/.trusted/scripts/deployment_promotion_emitter.py" \
            --artifact-id "${CONTRACT_ARTIFACT_ID}" \
            --artifact-sha256 "${CONTRACT_ARTIFACT_SHA256}" \
            --contract-sha256 "${CONTRACT_SHA256}" \
            --proof-artifact-id "${PROOF_ARTIFACT_ID}" \
            --proof-artifact-sha256 "${PROOF_ARTIFACT_SHA256}" \
            --proof-file-sha256 "${PROOF_FILE_SHA256}" \
            --output "${GITHUB_OUTPUT}"
  comment_result:
    name: comment_result
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - preflight
      - validate_inputs
      - operator_test
      - governance_test
      - platform_test
      - whole_test
      - operator_prod
      - governance_prod
      - platform_prod
      - whole_prod
      - prepare_promotion
      - publish_promotion
    if: ${{ always() && needs.preflight.outputs.feedback_pull_request_number != '' }}
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Post informational result to authenticated comment target
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.preflight.outputs.feedback_pull_request_number }}
          DISPLAY_COMMAND: ${{ needs.preflight.outputs.feedback_display_command }}
          HEAD_SHA: ${{ needs.preflight.outputs.feedback_head_sha }}
          GRAPH_RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          jq -n --arg command "${DISPLAY_COMMAND}" --arg sha "${HEAD_SHA}" \
            --arg url "${RUN_URL}" --argjson graph "${GRAPH_RESULTS}" \
            '{body: ("Pulumi command: `" + $command + "`\nCommit: `" + $sha + "`\nRun: " + $url + "\n\n" + ($graph | to_entries | map(.key + ": " + .value.result) | join("\n")) + "\n\n" + (if $graph.publish_promotion.result == "success" and $graph.publish_promotion.outputs.published == "true" then "Infrastructure Promotion: verified and published." else "Infrastructure Promotion was not verified as published (publisher: " + $graph.publish_promotion.result + ")." end))}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input -
