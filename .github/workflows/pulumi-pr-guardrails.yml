name: Pulumi PR Guardrails

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  preview:
    name: Preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_SKIP_UPDATE_CHECK: "true"
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      AWS_OIDC_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
      PULUMI_SECRETS_PROVIDER: ${{ vars.PULUMI_SECRETS_PROVIDER }}
      PULUMI_PREVIEW_STACKS: ${{ vars.PULUMI_PREVIEW_STACKS }}
      PULUMI_ALLOW_UNPRIVILEGED_PR_GUARDRAILS: ${{ vars.PULUMI_ALLOW_UNPRIVILEGED_PR_GUARDRAILS }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      GITHUB_REPOSITORY_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Select preview mode
        id: preview_mode
        run: |
          trusted=true
          privileged=true
          missing_guardrail_config=false
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && \
            "${GITHUB_HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY_NAME}" ]]; then
            trusted=false
            privileged=false
          fi
          if [[ -z "${AWS_OIDC_ROLE_ARN}" || \
            -z "${PULUMI_BACKEND_URL}" || \
            -z "${PULUMI_SECRETS_PROVIDER}" ]]; then
            missing_guardrail_config=true
            privileged=false
          fi
          if [[ "${trusted}" == "true" && \
            "${missing_guardrail_config}" == "true" && \
            "${PULUMI_ALLOW_UNPRIVILEGED_PR_GUARDRAILS}" != "true" ]]; then
            echo "::error::AWS-backed guardrail variables are missing. Configure AWS_OIDC_ROLE_ARN, PULUMI_BACKEND_URL, and PULUMI_SECRETS_PROVIDER, or explicitly set PULUMI_ALLOW_UNPRIVILEGED_PR_GUARDRAILS=true."
            exit 1
          fi
          echo "privileged=${privileged}" >> "${GITHUB_OUTPUT}"

      - name: Configure AWS credentials via OIDC
        if: ${{ steps.preview_mode.outputs.privileged == 'true' }}
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          role-session-name: gha-pulumi-preview-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}

      - name: Start development environment
        run: make start

      - name: Run preview guardrail
        env:
          PULUMI_REQUIRE_SHARED_BACKEND: ${{ steps.preview_mode.outputs.privileged }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ "${PULUMI_REQUIRE_SHARED_BACKEND}" == "true" ]]; then
            make publish-pulumi-preview-summary
          else
            make test-preview-unprivileged
          fi

      - name: Upload preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pulumi-preview
          path: .artifacts/pulumi-preview

  destructive_diff:
    name: Destructive Diff Gate
    if: >-
      ${{
        always() &&
        needs.preview.result == 'success'
      }}
    runs-on: ubuntu-latest
    needs:
      - preview
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Start development environment
        run: make start

      - name: Download preview artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: pulumi-preview
          path: .artifacts/pulumi-preview

      - name: Stage GitHub event payload for the guardrail helper
        run: |
          mkdir -p .artifacts
          cp "${GITHUB_EVENT_PATH}" .artifacts/github-event.json

      - name: Enforce destructive diff gate
        run: make test-destructive-diff

  iam_validation:
    name: IAM Validation
    runs-on: ubuntu-latest
    needs:
      - preview
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_SKIP_UPDATE_CHECK: "true"
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      AWS_OIDC_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
      PULUMI_SECRETS_PROVIDER: ${{ vars.PULUMI_SECRETS_PROVIDER }}
      PULUMI_ALLOW_UNPRIVILEGED_PR_GUARDRAILS: ${{ vars.PULUMI_ALLOW_UNPRIVILEGED_PR_GUARDRAILS }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      GITHUB_REPOSITORY_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Select IAM validation mode
        id: iam_mode
        run: |
          trusted=true
          privileged=true
          missing_guardrail_config=false
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && \
            "${GITHUB_HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY_NAME}" ]]; then
            trusted=false
            privileged=false
          fi
          if [[ -z "${AWS_OIDC_ROLE_ARN}" || \
            -z "${PULUMI_BACKEND_URL}" || \
            -z "${PULUMI_SECRETS_PROVIDER}" ]]; then
            missing_guardrail_config=true
            privileged=false
          fi
          if [[ "${trusted}" == "true" && \
            "${missing_guardrail_config}" == "true" && \
            "${PULUMI_ALLOW_UNPRIVILEGED_PR_GUARDRAILS}" != "true" ]]; then
            echo "::error::AWS-backed guardrail variables are missing. Configure AWS_OIDC_ROLE_ARN, PULUMI_BACKEND_URL, and PULUMI_SECRETS_PROVIDER, or explicitly set PULUMI_ALLOW_UNPRIVILEGED_PR_GUARDRAILS=true."
            exit 1
          fi
          echo "privileged=${privileged}" >> "${GITHUB_OUTPUT}"

      - name: Configure AWS credentials via OIDC
        if: ${{ steps.iam_mode.outputs.privileged == 'true' }}
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          role-session-name: gha-iam-validate-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}

      - name: Start development environment
        run: make start

      - name: Download preview artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: pulumi-preview
          path: .artifacts/pulumi-preview

      - name: Validate IAM policies
        env:
          PRIVILEGED_IAM_VALIDATION: ${{ steps.iam_mode.outputs.privileged }}
        run: |
          if [[ "${PRIVILEGED_IAM_VALIDATION}" == "true" ]]; then
            make test-iam-validation
          else
            make test-iam-validation-unprivileged
          fi
