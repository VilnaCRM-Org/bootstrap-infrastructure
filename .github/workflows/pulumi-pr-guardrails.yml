name: Pulumi PR Guardrails

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  preview_mode:
    name: Preview Mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      privileged: ${{ steps.preview_mode.outputs.privileged }}
    env:
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      GITHUB_REPOSITORY_NAME: ${{ github.repository }}
    steps:
      - name: Select preview mode
        id: preview_mode
        run: |
          privileged=true
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" && \
            "${GITHUB_HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY_NAME}" ]]; then
            privileged=false
            echo "::notice::Fork pull request detected; running unprivileged Pulumi guardrails without AWS credentials."
          fi
          echo "privileged=${privileged}" >> "${GITHUB_OUTPUT}"

  preview:
    name: Preview
    if: ${{ needs.preview_mode.outputs.privileged == 'true' }}
    runs-on: ubuntu-latest
    needs:
      - preview_mode
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_SKIP_UPDATE_CHECK: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Load test PR AWS CI configuration
        id: ci_config
        uses: ./.github/actions/load-aws-ci-env
        with:
          environment: ${{ github.event_name == 'pull_request' && 'test-pr' || 'test' }}
          config-role-arn: ${{ github.event_name == 'pull_request' && vars.AWS_TEST_PR_CI_CONFIG_ROLE_ARN || vars.AWS_TEST_CI_CONFIG_ROLE_ARN }}
          aws-region: ${{ vars.AWS_TEST_REGION }}
          purpose: test preview
          required-keys: >-
            AWS_ACCOUNT_ID,AWS_REGION,AWS_PREVIEW_ROLE_ARN,
            PULUMI_BACKEND_URL,PULUMI_SECRETS_PROVIDER,PULUMI_PREVIEW_STACKS

      - name: Validate preview prerequisites
        run: |
          missing=()
          for name in \
            AWS_ACCOUNT_ID \
            AWS_PREVIEW_ROLE_ARN \
            PULUMI_BACKEND_URL \
            PULUMI_SECRETS_PROVIDER \
            PULUMI_PREVIEW_STACKS; do
            if [[ -z "${!name}" ]]; then
              missing+=("${name}")
            fi
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            printf 'error: trusted PR guardrails are missing %s\n' "${missing[*]}" >&2
            echo "Populate the fixed AWS Secrets Manager CI config secret for the test PR preview or shared test stack." >&2
            exit 1
          fi
          if [[ ! "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]; then
            echo "error: AWS_ACCOUNT_ID must be a 12-digit AWS account ID." >&2
            exit 1
          fi
          if [[ "${PULUMI_BACKEND_URL}" != s3://* ]]; then
            echo "error: PULUMI_BACKEND_URL must use an s3:// backend." >&2
            exit 1
          fi
          if [[ "${PULUMI_SECRETS_PROVIDER}" != awskms://* ]]; then
            echo "error: PULUMI_SECRETS_PROVIDER must use an awskms:// URI." >&2
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: ${{ steps.ci_config.outputs.aws-preview-role-arn }}
          role-session-name: gha-test-preview-${{ github.run_id }}
          aws-region: ${{ steps.ci_config.outputs.aws-region }}
          allowed-account-ids: ${{ steps.ci_config.outputs.aws-account-id }}

      - name: Emit preview evidence
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "CI config secret: ${CI_CONFIG_SECRET_ID}"
          echo "Backend type: s3"
          echo "Commit SHA: ${GITHUB_SHA}"
          echo "Expected AWS account ID: ${AWS_ACCOUNT_ID}"
          echo "Current AWS account ID: ${account_id}"
          echo "Pulumi stacks: ${PULUMI_PREVIEW_STACKS}"
          echo "Guardrail mode: privileged"
          echo "Role purpose: preview"

      - name: Start development environment
        run: make start

      - name: Run preview guardrail
        env:
          PULUMI_REQUIRE_SHARED_BACKEND: "true"
          GITHUB_TOKEN: ${{ github.token }}
        run: make publish-pulumi-preview-summary

      - name: Upload preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pulumi-preview
          path: .artifacts/pulumi-preview
          retention-days: 7

  preview_unprivileged:
    name: Preview (Unprivileged)
    if: ${{ needs.preview_mode.outputs.privileged != 'true' }}
    runs-on: ubuntu-latest
    needs:
      - preview_mode
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Start development environment
        run: make start

      - name: Run unprivileged preview guardrail
        run: |
          echo "Guardrail mode: unprivileged"
          make test-preview-unprivileged

      - name: Upload preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pulumi-preview
          path: .artifacts/pulumi-preview
          retention-days: 7

  destructive_diff:
    name: Destructive Diff Gate
    if: ${{ always() && (needs.preview.result == 'success' || needs.preview_unprivileged.result == 'success') }}
    runs-on: ubuntu-latest
    needs:
      - preview
      - preview_unprivileged
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Start development environment
        run: make start

      - name: Download preview artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: pulumi-preview
          path: .artifacts/pulumi-preview

      - name: Stage GitHub event payload for the guardrail helper
        run: |
          mkdir -p .artifacts
          cp "${GITHUB_EVENT_PATH}" .artifacts/github-event.json

      - name: Enforce destructive diff gate
        run: make test-destructive-diff

      - name: Enforce cost and quota proxy
        run: |
          make test-cost-proxy || cost_rc=$?
          cat .artifacts/pulumi-preview/reports/cost-proxy.md >> "${GITHUB_STEP_SUMMARY}" 2>/dev/null || true
          exit "${cost_rc:-0}"

  iam_validation:
    name: IAM Validation
    if: ${{ needs.preview.result == 'success' }}
    runs-on: ubuntu-latest
    needs:
      - preview
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_SKIP_UPDATE_CHECK: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Load test PR AWS CI configuration
        id: ci_config
        uses: ./.github/actions/load-aws-ci-env
        with:
          environment: ${{ github.event_name == 'pull_request' && 'test-pr' || 'test' }}
          config-role-arn: ${{ github.event_name == 'pull_request' && vars.AWS_TEST_PR_CI_CONFIG_ROLE_ARN || vars.AWS_TEST_CI_CONFIG_ROLE_ARN }}
          aws-region: ${{ vars.AWS_TEST_REGION }}
          purpose: test IAM validation
          required-keys: >-
            AWS_ACCOUNT_ID,AWS_REGION,AWS_PREVIEW_ROLE_ARN,
            PULUMI_BACKEND_URL,PULUMI_SECRETS_PROVIDER,PULUMI_PREVIEW_STACKS

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: ${{ steps.ci_config.outputs.aws-preview-role-arn }}
          role-session-name: gha-test-iam-validate-${{ github.run_id }}
          aws-region: ${{ steps.ci_config.outputs.aws-region }}
          allowed-account-ids: ${{ steps.ci_config.outputs.aws-account-id }}

      - name: Start development environment
        run: make start

      - name: Download preview artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: pulumi-preview
          path: .artifacts/pulumi-preview

      - name: Validate IAM policies
        run: make test-iam-validation

  iam_validation_unprivileged:
    name: IAM Validation (Unprivileged)
    if: ${{ needs.preview_unprivileged.result == 'success' }}
    runs-on: ubuntu-latest
    needs:
      - preview_unprivileged
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Start development environment
        run: make start

      - name: Download preview artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: pulumi-preview
          path: .artifacts/pulumi-preview

      - name: Validate IAM policies
        run: make test-iam-validation-unprivileged
