name: Pulumi Deploy Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: pulumi-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test
    env:
      AWS_REGION: eu-central-1
      PULUMI_STACK: test
      PULUMI_ROLE_ARN: ${{ vars.PULUMI_TEST_ROLE_ARN }}
      PULUMI_SECRETS_PROVIDER: ${{ vars.PULUMI_TEST_SECRETS_PROVIDER }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Resolve backend bucket
        id: backend
        run: |
          if [ -z "${{ vars.PULUMI_STATE_BUCKET }}" ]; then
            echo "PULUMI_STATE_BUCKET repository variable must be set." >&2
            exit 1
          fi
          if [ -z "${PULUMI_ROLE_ARN}" ]; then
            echo "PULUMI_TEST_ROLE_ARN repository variable must be set." >&2
            exit 1
          fi
          if [ -z "${PULUMI_SECRETS_PROVIDER}" ]; then
            echo "PULUMI_TEST_SECRETS_PROVIDER repository variable must be set." >&2
            exit 1
          fi
          echo "bucket=${{ vars.PULUMI_STATE_BUCKET }}" >> "$GITHUB_OUTPUT"
          echo "backend_url=s3://${{ vars.PULUMI_STATE_BUCKET }}/state/${PULUMI_STACK}" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.21"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups --no-install-project --no-editable

      - name: Install Pulumi CLI
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          pulumi-version: "3.138.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.PULUMI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure Pulumi backend bucket exists
        env:
          BUCKET_NAME: ${{ steps.backend.outputs.bucket }}
        run: |
          head_output=$(aws s3api head-bucket --bucket "$BUCKET_NAME" 2>&1) && exists=true || exists=false
          if [ "$exists" = true ]; then
            echo "Pulumi backend bucket exists."
          else
            if echo "$head_output" | grep -qiE "AccessDenied|Forbidden|403"; then
              echo "Permission denied checking Pulumi backend bucket $BUCKET_NAME." >&2
              echo "$head_output" >&2
              exit 1
            fi
            echo "Creating Pulumi backend bucket $BUCKET_NAME in $AWS_REGION."
            if [ "$AWS_REGION" = "us-east-1" ]; then
              create_output=$(aws s3api create-bucket --bucket "$BUCKET_NAME" 2>&1) || create_status=$?
            else
              create_output=$(aws s3api create-bucket --bucket "$BUCKET_NAME" \
                --region "$AWS_REGION" \
                --create-bucket-configuration "LocationConstraint=$AWS_REGION" 2>&1) || create_status=$?
            fi
            if [ -n "${create_status:-}" ]; then
              if echo "$create_output" | grep -qiE "AccessDenied|Forbidden|403"; then
                echo "Permission denied creating Pulumi backend bucket $BUCKET_NAME." >&2
              fi
              echo "$create_output" >&2
              exit "$create_status"
            fi
          fi

      - name: Pulumi up
        env:
          PULUMI_BACKEND_URL: ${{ steps.backend.outputs.backend_url }}
          PULUMI_SECRETS_PROVIDER: ${{ env.PULUMI_SECRETS_PROVIDER }}
          PULUMI_STACK: ${{ env.PULUMI_STACK }}
          PULUMI_SKIP_UPDATE_CHECK: "true"
        run: bash ./scripts/run_pulumi_command.sh up
