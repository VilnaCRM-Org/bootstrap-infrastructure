name: Pulumi Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Pulumi stack to deploy (test or prod)"
        type: choice
        options:
          - test
          - prod
        default: test

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-central-1
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Select stack
        id: stack
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            STACK="${{ github.event.inputs.environment }}"
          else
            STACK="test"
          fi
          echo "stack=$STACK" >> "$GITHUB_OUTPUT"
          if [ "$STACK" = "prod" ]; then
            echo "role=${{ vars.PULUMI_PROD_ROLE_ARN }}" >> "$GITHUB_OUTPUT"
          else
            echo "role=${{ vars.PULUMI_TEST_ROLE_ARN }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve backend bucket
        id: backend
        run: |
          if [ -z "${{ vars.PULUMI_STATE_BUCKET }}" ]; then
            echo "PULUMI_STATE_BUCKET repository variable must be set." >&2
            exit 1
          fi
          echo "bucket=${{ vars.PULUMI_STATE_BUCKET }}" >> "$GITHUB_OUTPUT"
          echo "backend_url=s3://${{ vars.PULUMI_STATE_BUCKET }}/state/${{ steps.stack.outputs.stack }}" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
        with:
          version: "1.8.4"
          virtualenvs-create: false

      - name: Install dependencies
        run: poetry install --no-root --no-interaction

      - name: Install Pulumi CLI
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          pulumi-version: "3.138.0"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ steps.stack.outputs.role }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure Pulumi backend bucket exists
        env:
          BUCKET_NAME: ${{ steps.backend.outputs.bucket }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          head_output=$(aws s3api head-bucket --bucket "$BUCKET_NAME" 2>&1) && exists=true || exists=false
          if [ "$exists" = true ]; then
            echo "Pulumi backend bucket exists."
          else
            if echo "$head_output" | grep -qiE "AccessDenied|Forbidden|403"; then
              echo "Permission denied checking Pulumi backend bucket $BUCKET_NAME." >&2
              echo "$head_output" >&2
              exit 1
            fi
            echo "Creating Pulumi backend bucket $BUCKET_NAME in $AWS_REGION."
            if [ "$AWS_REGION" = "us-east-1" ]; then
              create_output=$(aws s3api create-bucket --bucket "$BUCKET_NAME" 2>&1) || create_status=$?
            else
              create_output=$(aws s3api create-bucket --bucket "$BUCKET_NAME" \
                --region "$AWS_REGION" \
                --create-bucket-configuration "LocationConstraint=$AWS_REGION" 2>&1) || create_status=$?
            fi
            if [ -n "${create_status:-}" ]; then
              if echo "$create_output" | grep -qiE "AccessDenied|Forbidden|403"; then
                echo "Permission denied creating Pulumi backend bucket $BUCKET_NAME." >&2
              fi
              echo "$create_output" >&2
              exit "$create_status"
            fi
          fi

      - name: Pulumi up
        env:
          PULUMI_STACK: ${{ steps.stack.outputs.stack }}
          PULUMI_BACKEND_URL: ${{ steps.backend.outputs.backend_url }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          poetry run pulumi -C pulumi stack select "$PULUMI_STACK" --create
          poetry run pulumi -C pulumi up --yes --skip-preview
