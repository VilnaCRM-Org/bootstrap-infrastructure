name: DevSecOps Guardrails

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Bandit
            target: check-bandit
            build_pulumi_container: true
          - name: Dependency Audit
            target: check-deps
            build_pulumi_container: true
          - name: SBOM Export
            target: check-sbom
            build_pulumi_container: true
          - name: Gitleaks
            target: check-secrets
            build_pulumi_container: false
          - name: YAML Lint
            target: check-yaml
            build_pulumi_container: true
          - name: Actionlint
            target: check-actionlint
            build_pulumi_container: false
          - name: Hadolint
            target: check-docker
            build_pulumi_container: false
          - name: Shell Quality
            target: check-shell
            build_pulumi_container: false
          - name: Checkov
            target: check-iac
            build_pulumi_container: false
          - name: Cost Guardrails
            target: test-cost
            build_pulumi_container: true
          - name: Qlty
            target: check-qlty
            build_pulumi_container: false
            requires_qlty: true
    name: ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Match container user to runner
        if: ${{ matrix.build_pulumi_container }}
        run: |
          {
            echo "UID=$(id -u)"
            echo "GID=$(id -g)"
            echo "USER=$(id -un)"
          } >> "$GITHUB_ENV"

      - name: Install Qlty CLI
        if: ${{ matrix.requires_qlty }}
        uses: qltysh/qlty-action/install@a19242102d17e497f437d7466aa01b528537e899 # v2.2.0

      - name: Build test container
        if: ${{ matrix.build_pulumi_container }}
        run: docker compose build pulumi

      - name: Run ${{ matrix.target }}
        run: make ${{ matrix.target }}
