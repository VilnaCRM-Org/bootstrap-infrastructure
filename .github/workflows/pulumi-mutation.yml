name: Pulumi Mutation Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare local Pulumi backend
        run: mkdir -p .pulumi-backend

      - name: Run mutation suite
        env:
          PULUMI_BACKEND_URL: file:///workspace/.pulumi-backend
          PULUMI_CONFIG_PASSPHRASE: ""
        run: make test-mutation
