name: Pulumi Mutation Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1.4.1
        with:
          version: "1.8.4"
          virtualenvs-create: false

      - name: Install dependencies
        run: poetry install --with dev --no-root --no-interaction

      - name: Install Pulumi CLI
        uses: pulumi/actions@v6
        with:
          pulumi-version: "3.138.0"

      - name: Prepare local Pulumi backend
        run: mkdir -p "${{ runner.temp }}/pulumi-backend"

      - name: Run mutation suite
        env:
          PULUMI_BACKEND_URL: file://${{ runner.temp }}/pulumi-backend
          PULUMI_CONFIG_PASSPHRASE: ""
        run: make test-mutation
