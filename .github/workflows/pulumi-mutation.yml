name: Pulumi Mutation Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          poetry install --with dev --no-root --no-interaction

      - name: Install Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: Prepare local Pulumi backend
        run: mkdir -p "${{ runner.temp }}/pulumi-backend"

      - name: Run mutation suite
        env:
          PULUMI_BACKEND_URL: file://${{ runner.temp }}/pulumi-backend
          PULUMI_CONFIG_PASSPHRASE: ""
        run: make test-mutation
