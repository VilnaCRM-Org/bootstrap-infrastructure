name: Pulumi Drift Detection

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: pulumi-drift-test
  cancel-in-progress: true

jobs:
  drift:
    if: >-
      vars.PULUMI_TEST_ROLE_ARN != '' &&
      vars.PULUMI_TEST_SECRETS_PROVIDER != '' &&
      vars.PULUMI_STATE_BUCKET != '' &&
      vars.PULUMI_TEST_RUNNER_ECR_REPOSITORY != ''
    runs-on: ubuntu-latest
    environment: test
    env:
      AWS_REGION: eu-central-1
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.PULUMI_TEST_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${registry}"

      - name: Run drift detection
        run: |
          mkdir -p out
          set -o pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          image_ref="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${{ vars.PULUMI_TEST_RUNNER_ECR_REPOSITORY }}:main"
          docker pull "${image_ref}"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION="${AWS_REGION}" \
            -e AWS_DEFAULT_REGION="${AWS_REGION}" \
            -e PULUMI_STACK="test" \
            -e PULUMI_DIR="pulumi" \
            -e PULUMI_BACKEND_URL="s3://${{ vars.PULUMI_STATE_BUCKET }}/state/test" \
            -e PULUMI_SECRETS_PROVIDER='${{ vars.PULUMI_TEST_SECRETS_PROVIDER }}' \
            -e PULUMI_SKIP_UPDATE_CHECK="true" \
            "${image_ref}" \
            bash -lc "./scripts/run_pulumi_command.sh drift" 2>&1 | tee out/pulumi-drift.log

      - name: Upload drift log
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: pulumi-drift-${{ github.run_id }}
          path: out/pulumi-drift.log
