name: Quality Monitoring

on:
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisory:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.continue_on_error }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Wily Maintainability Trends
            target: report-wily
            artifact_name: wily
            artifact_path: .quality-reports/wily
            summary_file: .quality-reports/wily/maintainability.txt
            continue_on_error: false
          - name: Vulture Dead Code Report
            target: report-vulture
            artifact_name: vulture
            artifact_path: .quality-reports/vulture.txt
            summary_file: .quality-reports/vulture.txt
            continue_on_error: true
          - name: Docstring Coverage
            target: report-docstrings
            artifact_name: docstring-coverage
            artifact_path: .quality-reports/docstr-coverage.txt
            summary_file: .quality-reports/docstr-coverage.txt
            continue_on_error: false
          - name: SBOM Snapshot
            target: report-sbom
            artifact_name: sbom
            artifact_path: .quality-reports/sbom.cyclonedx.json
            summary_file: ""
            continue_on_error: false
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Match container user to runner
        run: |
          {
            echo "UID=$(id -u)"
            echo "GID=$(id -g)"
            echo "USER=$(id -un)"
          } >> "$GITHUB_ENV"

      - name: Build test container
        run: docker compose build pulumi

      - name: Run ${{ matrix.target }}
        run: make ${{ matrix.target }}

      - name: Summarize report
        if: always() && matrix.summary_file != ''
        run: |
          if [ ! -f "${{ matrix.summary_file }}" ]; then
            exit 0
          fi
          {
            echo "## ${{ matrix.name }}"
            echo
            echo '```text'
            tail -n 200 "${{ matrix.summary_file }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: ${{ matrix.artifact_name }}-${{ github.run_id }}
          path: ${{ matrix.artifact_path }}
