name: Pulumi Integration Tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PULUMI_SKIP_UPDATE_CHECK: "true"
      PULUMI_ENABLE_AUTOMATION_STACK_TESTS: ${{ vars.PULUMI_ENABLE_AUTOMATION_STACK_TESTS }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Start development environment
        run: make start

      - name: Run integration suite inside Docker
        env:
          PULUMI_BACKEND_URL: file:///workspace/.pulumi-backend
        run: |
          if [[ "${PULUMI_ENABLE_AUTOMATION_STACK_TESTS}" == "true" ]]; then
            make test-integration
          else
            make test-integration-unprivileged
          fi
