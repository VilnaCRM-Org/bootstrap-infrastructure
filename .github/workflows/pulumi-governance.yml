name: Pulumi Governance Runner

# Retired compatibility event. Central commands use pulumi-pr-command and the
# dependency-ordered root controller; this path cannot issue credentials.
on:
  repository_dispatch:
    types:
      - pulumi-governance-command

permissions: {}

jobs:
  retired:
    name: Reject retired governance dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Reject obsolete event without deployment authority
        shell: bash
        run: |
          echo "The governance dispatch is retired. Submit a /pulumi PR command through the central intake." >&2
          exit 1
