name: Pulumi Governance Runner

# Dedicated, trusted governance apply path (architecture §7.2, §7.5, §5.1a).
# Keyed to its OWN repository_dispatch event type so the intake never asks a
# runner to do impossible cross-workflow routing. There is intentionally NO
# workflow_dispatch: a manual prod/up entry would bypass the @Kravalg gate
# (SECURITY-1). Every client_payload field is treated as untrusted and
# re-derived from the verified PR head SHA before any id-token job runs.
on:
  repository_dispatch:
    types:
      - pulumi-governance-command

concurrency:
  group: >-
    pulumi-governance-${{ github.event.client_payload.pull_request_number }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  preflight:
    name: Preflight (server-side re-auth)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No id-token here: trust is re-derived BEFORE any credential-minting job.
    permissions:
      contents: read
      issues: write
      # Rejection feedback is posted to the PR conversation; GitHub rejects this
      # with only issues: write on the Actions token.
      pull-requests: write
    outputs:
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      pull_request_number: ${{ steps.resolve.outputs.pull_request_number }}
      command: ${{ steps.resolve.outputs.command }}
      target_environment: ${{ steps.resolve.outputs.target_environment }}
    env:
      GH_TOKEN: ${{ github.token }}
      # All inputs arrive via client_payload only (no trusted workflow_dispatch).
      REQUEST_PR_NUMBER: ${{ github.event.client_payload.pull_request_number }}
      REQUEST_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
      REQUEST_COMMENT_ID: ${{ github.event.client_payload.comment_id }}
      # command (plan|up) and target_environment (test|prod) arrive via
      # client_payload too and are NEVER trusted blindly — preflight re-validates
      # them against a fixed allowlist before emitting them as job-guard outputs.
      REQUEST_COMMAND: ${{ github.event.client_payload.command }}
      REQUEST_TARGET_ENVIRONMENT: ${{ github.event.client_payload.target_environment }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Re-derive trust and verify governance request
        id: resolve
        run: |
          post_pr_comment() {
            local pr_number="$1"
            local body="$2"
            jq -n --arg body "${body}" '{body: $body}' \
              | gh api \
                --method POST \
                "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments" \
                --input -
          }

          if [[ ! "${REQUEST_PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "error: pull_request_number must be numeric." >&2
            exit 1
          fi
          if [[ ! "${REQUEST_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "error: head_sha must be a full lowercase 40-character commit SHA." >&2
            exit 1
          fi
          if [[ ! "${REQUEST_COMMENT_ID}" =~ ^[0-9]+$ ]]; then
            echo "error: comment_id must be numeric." >&2
            exit 1
          fi
          # Re-derive command + target server-side against a fixed allowlist; the
          # client_payload values are untrusted. An out-of-range value is a
          # malformed request (exit 1, no postable run) exactly like a bad SHA.
          if [[ "${REQUEST_COMMAND}" != "plan" && "${REQUEST_COMMAND}" != "up" ]]; then
            echo "error: command must be plan or up." >&2
            exit 1
          fi
          if [[ "${REQUEST_TARGET_ENVIRONMENT}" != "test" \
                && "${REQUEST_TARGET_ENVIRONMENT}" != "prod" ]]; then
            echo "error: target_environment must be test or prod." >&2
            exit 1
          fi

          # Emit the resolved head SHA / PR number / command / target as soon as
          # the FORMAT is known to be valid (numeric PR, 40-char lowercase SHA,
          # allowlisted command/target), and BEFORE any auth/scope/head-moved
          # rejection that exits 1. A rejected governance PR must still leave these
          # outputs populated so the always() status job can post a TERMINAL
          # "Governance Apply" failure to the head SHA instead of stranding the
          # required check pending (FEASIBILITY-1). The command/target outputs gate
          # which apply jobs run (plan never applies; test-up never reaches prod).
          {
            echo "head_sha=${REQUEST_HEAD_SHA}"
            echo "pull_request_number=${REQUEST_PR_NUMBER}"
            echo "command=${REQUEST_COMMAND}"
            echo "target_environment=${REQUEST_TARGET_ENVIRONMENT}"
          } >> "${GITHUB_OUTPUT}"

          # Re-validate PR number / head SHA / open-not-merged / same-repo head.
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${REQUEST_PR_NUMBER}")"
          actual_head_sha="$(jq -r '.head.sha' <<< "${pr_json}")"
          actual_head_repo="$(jq -r '.head.repo.full_name' <<< "${pr_json}")"
          actual_pr_state="$(jq -r '.state' <<< "${pr_json}")"
          actual_pr_merged="$(jq -r '.merged' <<< "${pr_json}")"
          if [[ "${actual_pr_state}" != "open" || "${actual_pr_merged}" == "true" ]]; then
            post_pr_comment "${REQUEST_PR_NUMBER}" "Governance runner rejected this request because the pull request is closed or merged."
            exit 1
          fi
          if [[ "${actual_head_repo}" != "${GITHUB_REPOSITORY}" ]]; then
            post_pr_comment "${REQUEST_PR_NUMBER}" "Governance runner rejected this request because the pull request head is not in the base repository."
            exit 1
          fi
          if [[ "${actual_head_sha}" != "${REQUEST_HEAD_SHA}" ]]; then
            post_pr_comment "${REQUEST_PR_NUMBER}" "Governance runner rejected this request because the pull request head moved after the command was queued. Comment again on the latest commit."
            exit 1
          fi

          # Resolve the untrusted comment_id back to its author and require the
          # sole approver @Kravalg (case-insensitive). The author decision lives
          # in this trusted runner; the intake gate is defense-in-depth only.
          comment_json="$(gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${REQUEST_COMMENT_ID}")"
          comment_author="$(jq -r '.user.login' <<< "${comment_json}")"
          if [[ "${comment_author,,}" != "kravalg" ]]; then
            post_pr_comment "${REQUEST_PR_NUMBER}" "Governance runner rejected this request because the governance apply is restricted to the sole approver @Kravalg."
            exit 1
          fi

          # Recompute governance scope server-side from the verified head SHA's
          # changed files. The client_payload governance flag is never trusted.
          changed_files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${REQUEST_PR_NUMBER}/files" --jq '.[].filename')"
          governance_touched="$(printf '%s\n' "${changed_files}" | python ./scripts/governance_paths.py --files-stdin)"
          if [[ "${governance_touched}" != "governance_touched=true" ]]; then
            post_pr_comment "${REQUEST_PR_NUMBER}" "Governance runner rejected this request because the recomputed scope is not governance; only governance changes may mint governance credentials."
            exit 1
          fi

          # head_sha / pull_request_number were already emitted above, right
          # after format validation, so auth/scope/head-moved rejections still
          # leave the status job able to post a terminal failure.

  governance_test_plan:
    name: Governance Test Plan
    runs-on: ubuntu-latest
    needs:
      - preflight
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_SKIP_UPDATE_CHECK: "true"
      PULUMI_DIR: pulumi/governance
      PULUMI_STACK: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          persist-credentials: false

      - name: Load test AWS CI configuration
        id: ci_config
        uses: ./.github/actions/load-aws-ci-env
        with:
          environment: test
          config-role-arn: ${{ vars.AWS_TEST_CI_CONFIG_ROLE_ARN }}
          aws-region: ${{ vars.AWS_TEST_REGION }}
          purpose: Governance test plan
          required-keys: >-
            AWS_ACCOUNT_ID,AWS_REGION,AWS_PREVIEW_ROLE_ARN,
            PULUMI_BACKEND_URL,PULUMI_SECRETS_PROVIDER,PULUMI_PREVIEW_STACKS

      - name: Configure AWS preview credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: ${{ steps.ci_config.outputs.aws-preview-role-arn }}
          role-session-name: gha-gov-test-plan-${{ github.run_id }}
          aws-region: ${{ steps.ci_config.outputs.aws-region }}
          allowed-account-ids: ${{ steps.ci_config.outputs.aws-account-id }}

      - name: Start development environment
        run: make start

      - name: Save governance test update plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULUMI_COMMIT_SHA: ${{ needs.preflight.outputs.head_sha }}
        run: make pulumi-plan

      - name: Upload governance test plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: >-
            governance-${{ needs.preflight.outputs.pull_request_number }}-${{
            needs.preflight.outputs.head_sha }}-test-plan
          path: .artifacts/pulumi-plan
          retention-days: 7

  governance_test_apply:
    name: Governance Test Apply
    # Runs only for an apply request: `test up` (apply the test stack) or any
    # `prod` request (test-then-prod ordering applies test first, FR15). A `plan`
    # request NEVER reaches this apply job; a `test up` request never reaches the
    # prod jobs below.
    if: >-
      needs.preflight.outputs.target_environment == 'prod' ||
      (needs.preflight.outputs.target_environment == 'test' &&
      needs.preflight.outputs.command == 'up')
    runs-on: ubuntu-latest
    needs:
      - preflight
      - governance_test_plan
    timeout-minutes: 30
    # Static env gate: the @Kravalg reviewer (FR11) fires before the TEST apply
    # mutates AWS (SECURITY-2: the test apply is gated, not just prod).
    environment: governance
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_SKIP_UPDATE_CHECK: "true"
      PULUMI_DIR: pulumi/governance
      PULUMI_STACK: test
      # The governance program's OWN backend + secrets provider (the platform
      # bootstrap state, NOT a managed repo's CI config). These are fixed,
      # account-level values set as repo variables by the operator (runbook).
      PULUMI_BACKEND_URL: ${{ vars.AWS_GOVERNANCE_TEST_BACKEND_URL }}
      PULUMI_SECRETS_PROVIDER: ${{ vars.AWS_GOVERNANCE_TEST_SECRETS_PROVIDER }}
      PULUMI_PREVIEW_STACKS: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          persist-credentials: false

      # The apply job runs under `environment: governance`, so the OIDC token's
      # `environment` claim is `governance` and its `sub` is
      # `repo:VilnaCRM-Org/bootstrap-infrastructure:environment:governance`. The
      # bootstrap test/prod CI-config and deploy roles trust `environment:test`/
      # `environment:prod`/branch-ref — NOT `environment:governance` — so they
      # CANNOT be assumed here. The runner instead assumes the dedicated
      # per-account governance automation role whose trust accepts
      # `environment:governance` and whose permissions apply the pulumi/governance
      # program. That role is created by the one-time operator bootstrap (admin)
      # and pinned in the repo variable AWS_GOVERNANCE_TEST_APPLY_ROLE_ARN (the
      # prod account uses AWS_GOVERNANCE_PROD_APPLY_ROLE_ARN); see
      # docs/governance-stack.md.
      - name: Configure AWS governance apply credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          # Per-account governance automation role for the test account
          # (891377212104). Trust = environment:governance only.
          role-to-assume: ${{ vars.AWS_GOVERNANCE_TEST_APPLY_ROLE_ARN }}
          role-session-name: gha-gov-test-apply-${{ github.run_id }}
          aws-region: ${{ vars.AWS_TEST_REGION }}
          allowed-account-ids: ${{ vars.AWS_GOVERNANCE_TEST_ACCOUNT_ID }}

      - name: Start development environment
        run: make start

      - name: Download governance test plan artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: >-
            governance-${{ needs.preflight.outputs.pull_request_number }}-${{
            needs.preflight.outputs.head_sha }}-test-plan
          path: .artifacts/pulumi-plan

      - name: Apply saved governance test plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULUMI_EXPECTED_SHA: ${{ needs.preflight.outputs.head_sha }}
        run: make pulumi-up-plan

  governance_test_post_apply_drift:
    name: Governance Test Post-Apply Drift
    # Runs whenever the test apply ran (test up, or any prod request); never for
    # a plan-only request.
    if: >-
      needs.preflight.outputs.target_environment == 'prod' ||
      (needs.preflight.outputs.target_environment == 'test' &&
      needs.preflight.outputs.command == 'up')
    runs-on: ubuntu-latest
    needs:
      - preflight
      - governance_test_apply
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_SKIP_UPDATE_CHECK: "true"
      PULUMI_DIR: pulumi/governance
      PULUMI_STACK: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          persist-credentials: false

      - name: Load test AWS CI configuration
        id: ci_config
        uses: ./.github/actions/load-aws-ci-env
        with:
          environment: test
          config-role-arn: ${{ vars.AWS_TEST_CI_CONFIG_ROLE_ARN }}
          aws-region: ${{ vars.AWS_TEST_REGION }}
          purpose: Governance test drift
          required-keys: >-
            AWS_ACCOUNT_ID,AWS_REGION,AWS_DRIFT_ROLE_ARN,
            PULUMI_BACKEND_URL,PULUMI_SECRETS_PROVIDER,PULUMI_DRIFT_STACKS

      - name: Configure AWS drift credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: ${{ steps.ci_config.outputs.aws-drift-role-arn }}
          role-session-name: gha-gov-test-drift-${{ github.run_id }}
          aws-region: ${{ steps.ci_config.outputs.aws-region }}
          allowed-account-ids: ${{ steps.ci_config.outputs.aws-account-id }}

      - name: Start development environment
        run: make start

      - name: Run governance test post-apply drift detection
        env:
          PULUMI_DRIFT_STACKS: test
        run: make test-drift

  governance_prod_plan:
    name: Governance Prod Plan
    # Prod jobs run ONLY for a prod request, and only after the test apply +
    # post-apply drift succeeded (test-then-prod, FR15). A `test ...` request
    # (plan or up) never reaches any prod job.
    if: >-
      needs.preflight.outputs.target_environment == 'prod' &&
      needs.governance_test_post_apply_drift.result == 'success'
    runs-on: ubuntu-latest
    needs:
      - preflight
      - governance_test_apply
      - governance_test_post_apply_drift
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_SKIP_UPDATE_CHECK: "true"
      PULUMI_DIR: pulumi/governance
      PULUMI_STACK: prod
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          persist-credentials: false

      - name: Load prod preview AWS CI configuration
        id: ci_config
        uses: ./.github/actions/load-aws-ci-env
        with:
          environment: prod-preview
          config-role-arn: ${{ vars.AWS_PROD_PREVIEW_CI_CONFIG_ROLE_ARN }}
          aws-region: ${{ vars.AWS_PROD_REGION }}
          purpose: Governance prod plan
          required-keys: >-
            AWS_ACCOUNT_ID,AWS_REGION,AWS_PREVIEW_ROLE_ARN,
            PULUMI_BACKEND_URL,PULUMI_SECRETS_PROVIDER,PULUMI_PREVIEW_STACKS

      - name: Configure AWS preview credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: ${{ steps.ci_config.outputs.aws-preview-role-arn }}
          role-session-name: gha-gov-prod-plan-${{ github.run_id }}
          aws-region: ${{ steps.ci_config.outputs.aws-region }}
          allowed-account-ids: ${{ steps.ci_config.outputs.aws-account-id }}

      - name: Start development environment
        run: make start

      - name: Save governance prod update plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULUMI_COMMIT_SHA: ${{ needs.preflight.outputs.head_sha }}
        run: make pulumi-plan

      - name: Upload governance prod plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: >-
            governance-${{ needs.preflight.outputs.pull_request_number }}-${{
            needs.preflight.outputs.head_sha }}-prod-plan
          path: .artifacts/pulumi-plan
          retention-days: 7

  governance_prod_apply:
    name: Governance Prod Apply
    # The prod stack is mutated ONLY for `prod up`: a `prod plan` runs the
    # test apply + prod preview (test-then-prod validation) but never applies prod.
    if: >-
      needs.preflight.outputs.target_environment == 'prod' &&
      needs.preflight.outputs.command == 'up'
    runs-on: ubuntu-latest
    needs:
      - preflight
      - governance_test_apply
      - governance_test_post_apply_drift
      - governance_prod_plan
    timeout-minutes: 30
    # Static env gate: the @Kravalg reviewer (FR11) fires before the PROD apply
    # mutates AWS. test_* -> prod_* ordering mirrors the existing runner (FR15).
    environment: governance
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_SKIP_UPDATE_CHECK: "true"
      PULUMI_DIR: pulumi/governance
      PULUMI_STACK: prod
      # The governance program's OWN prod backend + secrets provider (platform
      # bootstrap state), set as repo variables by the operator (runbook).
      PULUMI_BACKEND_URL: ${{ vars.AWS_GOVERNANCE_PROD_BACKEND_URL }}
      PULUMI_SECRETS_PROVIDER: ${{ vars.AWS_GOVERNANCE_PROD_SECRETS_PROVIDER }}
      PULUMI_PREVIEW_STACKS: prod
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          persist-credentials: false

      - name: Verify approved commit SHA
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "${checked_out_sha}" != "${{ needs.preflight.outputs.head_sha }}" ]]; then
            echo "error: approved workflow SHA does not match checked-out governance SHA" >&2
            exit 1
          fi
          echo "Approved governance SHA: ${checked_out_sha}"

      # As with the test apply: this job runs under `environment: governance`, so
      # the OIDC token carries `environment:governance`. Only the dedicated
      # governance automation role trusts that claim; the bootstrap prod deploy /
      # CI-config roles (which trust `environment:prod`) cannot be assumed here.
      - name: Configure AWS governance apply credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          # Per-account governance automation role for the prod account
          # (933245420672). Trust = environment:governance only.
          role-to-assume: ${{ vars.AWS_GOVERNANCE_PROD_APPLY_ROLE_ARN }}
          role-session-name: gha-gov-prod-apply-${{ github.run_id }}
          aws-region: ${{ vars.AWS_PROD_REGION }}
          allowed-account-ids: ${{ vars.AWS_GOVERNANCE_PROD_ACCOUNT_ID }}

      - name: Start development environment
        run: make start

      - name: Download governance prod plan artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: >-
            governance-${{ needs.preflight.outputs.pull_request_number }}-${{
            needs.preflight.outputs.head_sha }}-prod-plan
          path: .artifacts/pulumi-plan

      - name: Apply saved governance prod plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULUMI_EXPECTED_SHA: ${{ needs.preflight.outputs.head_sha }}
        run: make pulumi-up-plan

  governance_status:
    name: Governance Apply Status
    if: always()
    runs-on: ubuntu-latest
    needs:
      - preflight
      - governance_test_plan
      - governance_test_apply
      - governance_test_post_apply_drift
      - governance_prod_plan
      - governance_prod_apply
    timeout-minutes: 10
    permissions:
      # statuses: write lets the runner post the success-before-merge commit
      # status; the repository_dispatch trigger cannot natively report a check.
      statuses: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
      PR_NUMBER: ${{ needs.preflight.outputs.pull_request_number }}
      REQUEST_COMMAND: ${{ needs.preflight.outputs.command }}
      REQUEST_TARGET_ENVIRONMENT: ${{ needs.preflight.outputs.target_environment }}
      TEST_PLAN_RESULT: ${{ needs.governance_test_plan.result }}
      TEST_APPLY_RESULT: ${{ needs.governance_test_apply.result }}
      PROD_PLAN_RESULT: ${{ needs.governance_prod_plan.result }}
      PROD_APPLY_RESULT: ${{ needs.governance_prod_apply.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Post Governance Apply commit status
        # Guard ONLY on a genuinely empty head_sha: a malformed request that
        # failed format validation never emitted an output and a status cannot
        # be posted to a missing SHA. Every other outcome (including a preflight
        # auth/scope/head-moved rejection) DID emit head_sha and must post a
        # TERMINAL status so the required check never strands pending.
        if: needs.preflight.outputs.head_sha != ''
        run: |
          # The "Governance Apply" status resolves only because this runner
          # explicitly posts that exact context to the approved head SHA (FR15,
          # FEASIBILITY-1). The state is ALWAYS terminal — never pending — and it
          # reflects the stage the REQUEST was meant to reach so a `plan` or a
          # `test up` is not reported as a failed prod apply:
          #   - prod up  -> the gated prod apply result (the success-before-merge
          #                 signal: success only when prod actually applied)
          #   - test up  -> the test apply result
          #   - plan     -> the relevant plan result (test plan / prod plan)
          # A preflight rejection short-circuits every job to skipped/empty, which
          # maps to failure (terminal). Any non-success result is a failure.
          case "${REQUEST_COMMAND}:${REQUEST_TARGET_ENVIRONMENT}" in
            up:prod) gate_result="${PROD_APPLY_RESULT}" ;;
            up:test) gate_result="${TEST_APPLY_RESULT}" ;;
            plan:prod) gate_result="${PROD_PLAN_RESULT}" ;;
            plan:test) gate_result="${TEST_PLAN_RESULT}" ;;
            # Empty/unknown command+target means a malformed/rejected request.
            *) gate_result="${PROD_APPLY_RESULT}" ;;
          esac
          case "${gate_result}" in
            success) status_state="success" ;;
            *) status_state="failure" ;;
          esac
          if [[ "${status_state}" == "success" ]]; then
            status_description="Governance ${REQUEST_COMMAND:-apply} succeeded."
          else
            status_description="Governance ${REQUEST_COMMAND:-apply} rejected or did not complete."
          fi
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="${status_state}" \
            -f context="Governance Apply" \
            -f "target_url=${RUN_URL}" \
            -f description="${status_description}"

      - name: Post governance result comment
        if: needs.preflight.outputs.pull_request_number != ''
        run: |
          body_file="$(mktemp)"
          {
            echo "## Governance apply result"
            echo
            echo "- Commit: \`${HEAD_SHA}\`"
            echo "- Workflow run: ${RUN_URL}"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Preflight | \`${{ needs.preflight.result }}\` |"
            echo "| Test plan | \`${{ needs.governance_test_plan.result }}\` |"
            echo "| Test apply | \`${{ needs.governance_test_apply.result }}\` |"
            echo "| Test post-apply drift | \`${{ needs.governance_test_post_apply_drift.result }}\` |"
            echo "| Prod plan | \`${{ needs.governance_prod_plan.result }}\` |"
            echo "| Prod apply | \`${{ needs.governance_prod_apply.result }}\` |"
            echo
            echo "The \`Governance Apply\` commit status is posted to the approved head SHA as the success-before-merge gate."
          } > "${body_file}"
          jq -Rs '{body: .}' < "${body_file}" \
            | gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --input -
