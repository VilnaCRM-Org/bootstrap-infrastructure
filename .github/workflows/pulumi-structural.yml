name: Pulumi Structural Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  structural:
    name: Structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Match container user to runner
        run: |
          {
            echo "UID=$(id -u)"
            echo "GID=$(id -g)"
            echo "USER=$(id -un)"
          } >> "$GITHUB_ENV"

      - name: Build test container
        run: docker compose build pulumi

      - name: Run structural suite
        run: make test-pulumi
