name: Python Quality Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            target: check-format
          - name: Lint
            target: check-lint
          - name: Radon Maintainability
            target: check-radon
          - name: Xenon Complexity
            target: check-xenon
          - name: Import Linter
            target: check-imports
          - name: Deptry
            target: check-deptry
          - name: Spelling
            target: check-spelling
          - name: TOML
            target: check-toml
          - name: Types
            target: check-types
          - name: Ty
            target: check-ty
          - name: Package And Lockfile
            target: check-package
    name: ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Match container user to runner
        run: |
          {
            echo "UID=$(id -u)"
            echo "GID=$(id -g)"
            echo "USER=$(id -un)"
          } >> "$GITHUB_ENV"

      - name: Build test container
        run: docker compose build pulumi

      - name: Run ${{ matrix.target }}
        run: make ${{ matrix.target }}
