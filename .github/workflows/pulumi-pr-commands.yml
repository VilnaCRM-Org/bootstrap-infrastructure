name: Pulumi PR Commands

on:
  issue_comment:
    types:
      - created

permissions:
  id-token: write
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pulumi-pr-command-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  command:
    if: github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    environment: test
    env:
      AWS_REGION: eu-central-1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Parse command
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          normalized_body="$(printf '%s' "${COMMENT_BODY}" | tr '[:upper:]' '[:lower:]' | xargs)"
          case "${normalized_body}" in
            "pulumi plan"|"/pulumi plan")
              echo "command=plan" >> "$GITHUB_OUTPUT"
              ;;
            "pulumi up"|"/pulumi up")
              echo "command=up" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

          case "${COMMENT_ASSOCIATION}" in
            OWNER|MEMBER|COLLABORATOR)
              echo "authorized=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "authorized=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Resolve PR metadata
        if: steps.parse.outputs.skip != 'true'
        id: pr
        run: |
          {
            echo "head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.issue.number }}" --jq '.head.sha')"
            echo "head_ref=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.issue.number }}" --jq '.head.ref')"
            echo "head_repo=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.issue.number }}" --jq '.head.repo.full_name')"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on unsupported requests
        if: steps.parse.outputs.skip == 'true'
        run: echo "Skipping non-Pulumi PR comment."

      - name: Comment on unauthorized requests
        if: >-
          steps.parse.outputs.skip != 'true' &&
          steps.parse.outputs.authorized != 'true'
        run: |
          gh pr comment ${{ github.event.issue.number }} --body "Pulumi PR commands are restricted to repository owners, members, and collaborators."

      - name: Comment on forked PRs
        if: >-
          steps.parse.outputs.skip != 'true' &&
          steps.parse.outputs.authorized == 'true' &&
          steps.pr.outputs.head_repo != github.repository
        run: |
          body_file="$(mktemp)"
          cat > "${body_file}" <<'EOF'
          Pulumi PR commands are only enabled for branches in this repository.
          Forked pull requests are rejected to avoid exposing AWS credentials.
          EOF
          gh pr comment ${{ github.event.issue.number }} --body-file "${body_file}"

      - name: Verify bootstrap variables are present
        if: >-
          steps.parse.outputs.skip != 'true' &&
          steps.parse.outputs.authorized == 'true' &&
          steps.pr.outputs.head_repo == github.repository
        run: |
          test -n '${{ vars.PULUMI_TEST_ROLE_ARN }}'
          test -n '${{ vars.PULUMI_TEST_SECRETS_PROVIDER }}'
          test -n '${{ vars.PULUMI_STATE_BUCKET }}'
          test -n '${{ vars.PULUMI_TEST_RUNNER_ECR_REPOSITORY }}'

      - name: Checkout PR head
        if: >-
          steps.parse.outputs.skip != 'true' &&
          steps.parse.outputs.authorized == 'true' &&
          steps.pr.outputs.head_repo == github.repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}

      - name: Configure AWS credentials
        if: >-
          steps.parse.outputs.skip != 'true' &&
          steps.parse.outputs.authorized == 'true' &&
          steps.pr.outputs.head_repo == github.repository
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.PULUMI_TEST_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve runner image
        if: >-
          steps.parse.outputs.skip != 'true' &&
          steps.parse.outputs.authorized == 'true' &&
          steps.pr.outputs.head_repo == github.repository
        id: image
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          repository='${{ vars.PULUMI_TEST_RUNNER_ECR_REPOSITORY }}'
          primary_tag="sha-${{ steps.pr.outputs.head_sha }}"

          if aws ecr describe-images --region "${AWS_REGION}" --repository-name "${repository}" --image-ids imageTag="${primary_tag}" >/dev/null 2>&1; then
            selected_tag="${primary_tag}"
          else
            selected_tag="main"
          fi

          echo "image_ref=${registry}/${repository}:${selected_tag}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${selected_tag}" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        if: >-
          steps.parse.outputs.skip != 'true' &&
          steps.parse.outputs.authorized == 'true' &&
          steps.pr.outputs.head_repo == github.repository
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${registry}"

      - name: Pull runner image
        if: >-
          steps.parse.outputs.skip != 'true' &&
          steps.parse.outputs.authorized == 'true' &&
          steps.pr.outputs.head_repo == github.repository
        run: docker pull '${{ steps.image.outputs.image_ref }}'

      - name: Run Pulumi command
        if: >-
          steps.parse.outputs.skip != 'true' &&
          steps.parse.outputs.authorized == 'true' &&
          steps.pr.outputs.head_repo == github.repository
        id: run_command
        run: |
          mkdir -p out
          set -o pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            -e AWS_REGION="${AWS_REGION}" \
            -e AWS_DEFAULT_REGION="${AWS_REGION}" \
            -e PULUMI_STACK="test" \
            -e PULUMI_DIR="pulumi" \
            -e PULUMI_BACKEND_URL="s3://${{ vars.PULUMI_STATE_BUCKET }}/state/test" \
            -e PULUMI_SECRETS_PROVIDER='${{ vars.PULUMI_TEST_SECRETS_PROVIDER }}' \
            -e PULUMI_SKIP_UPDATE_CHECK="true" \
            '${{ steps.image.outputs.image_ref }}' \
            bash -lc "./scripts/run_pulumi_command.sh '${{ steps.parse.outputs.command }}'" 2>&1 | tee out/pulumi-command.log

      - name: Upload Pulumi command log
        if: >-
          always() &&
          steps.parse.outputs.skip != 'true' &&
          steps.parse.outputs.authorized == 'true' &&
          steps.pr.outputs.head_repo == github.repository
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: pulumi-${{ steps.parse.outputs.command }}-${{ github.event.issue.number }}-${{ steps.pr.outputs.head_sha }}
          path: out/pulumi-command.log

      - name: Comment command result
        if: >-
          always() &&
          steps.parse.outputs.skip != 'true' &&
          steps.parse.outputs.authorized == 'true' &&
          steps.pr.outputs.head_repo == github.repository
        run: |
          log_tail="$(tail -n 80 out/pulumi-command.log 2>/dev/null || true)"
          status_text='${{ steps.run_command.outcome }}'
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body_file="$(mktemp)"
          {
            echo "## Pulumi ${{ steps.parse.outputs.command }}: ${status_text}"
            echo
            echo "- Stack: \`test\`"
            echo "- Commit: \`${{ steps.pr.outputs.head_sha }}\`"
            echo "- Runner image: \`${{ steps.image.outputs.image_ref }}\`"
            echo "- Workflow run: ${run_url}"
            echo
            echo "<details><summary>Log tail</summary>"
            echo
            echo '```text'
            printf '%s\n' "${log_tail}"
            echo '```'
            echo
            echo "</details>"
          } > "${body_file}"
          gh pr comment ${{ github.event.issue.number }} --body-file "${body_file}"
