name: Pulumi PR Commands

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pulumi-pr-command-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  command:
    if: github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Parse command
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          normalized_body="$(printf '%s' "${COMMENT_BODY}" | tr '[:upper:]' '[:lower:]' | xargs)"
          case "${normalized_body}" in
            "pulumi plan"|"/pulumi plan")
              echo "command=plan" >> "$GITHUB_OUTPUT"
              ;;
            "pulumi up"|"/pulumi up")
              echo "command=up" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
          esac

          case "${COMMENT_ASSOCIATION}" in
            OWNER|MEMBER|COLLABORATOR)
              echo "authorized=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "authorized=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Resolve PR metadata
        if: steps.parse.outputs.skip != 'true'
        id: pr
        run: |
          {
            echo "head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.issue.number }}" --jq '.head.sha')"
            echo "head_ref=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.issue.number }}" --jq '.head.ref')"
            echo "head_repo=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.issue.number }}" --jq '.head.repo.full_name')"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on unsupported requests
        if: steps.parse.outputs.skip == 'true'
        run: echo "Skipping non-Pulumi PR comment."

      - name: Comment on unauthorized requests
        if: >-
          steps.parse.outputs.skip != 'true' &&
          steps.parse.outputs.authorized != 'true'
        run: |
          gh pr comment ${{ github.event.issue.number }} --body "Pulumi PR commands are restricted to repository owners, members, and collaborators."

      - name: Comment on forked PRs
        if: >-
          steps.parse.outputs.skip != 'true' &&
          steps.parse.outputs.authorized == 'true' &&
          steps.pr.outputs.head_repo != github.repository
        run: |
          body_file="$(mktemp)"
          cat > "${body_file}" <<'EOF'
          Pulumi PR commands are only enabled for branches in this repository.
          Forked pull requests are rejected to avoid exposing AWS credentials.
          EOF
          gh pr comment ${{ github.event.issue.number }} --body-file "${body_file}"

      - name: Detect automation configuration
        id: config
        if: >-
          steps.parse.outputs.skip != 'true' &&
          steps.parse.outputs.authorized == 'true' &&
          steps.pr.outputs.head_repo == github.repository
        run: |
          missing=()
          [ -n '${{ vars.PULUMI_TEST_ROLE_ARN }}' ] || missing+=(PULUMI_TEST_ROLE_ARN)
          [ -n '${{ vars.PULUMI_TEST_SECRETS_PROVIDER }}' ] || missing+=(PULUMI_TEST_SECRETS_PROVIDER)
          [ -n '${{ vars.PULUMI_STATE_BUCKET }}' ] || missing+=(PULUMI_STATE_BUCKET)
          [ -n '${{ vars.PULUMI_TEST_RUNNER_ECR_REPOSITORY }}' ] || missing+=(PULUMI_TEST_RUNNER_ECR_REPOSITORY)
          if [ ${#missing[@]} -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          printf 'missing=%s\n' "$(IFS=,; echo "${missing[*]}")" >> "$GITHUB_OUTPUT"

      - name: Comment on missing automation configuration
        if: >-
          steps.parse.outputs.skip != 'true' &&
          steps.parse.outputs.authorized == 'true' &&
          steps.pr.outputs.head_repo == github.repository &&
          steps.config.outputs.configured != 'true'
        run: |
          body_file="$(mktemp)"
          {
            echo "Pulumi PR commands are not configured for this repository."
            echo
            echo "Missing variables: \`${{ steps.config.outputs.missing }}\`."
          } > "${body_file}"
          gh pr comment ${{ github.event.issue.number }} --body-file "${body_file}"

      - name: Dispatch runner workflow
        if: >-
          steps.parse.outputs.skip != 'true' &&
          steps.parse.outputs.authorized == 'true' &&
          steps.pr.outputs.head_repo == github.repository &&
          steps.config.outputs.configured == 'true'
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type='pulumi-pr-command' \
            -f "client_payload[pull_request_number]=${{ github.event.issue.number }}" \
            -f "client_payload[head_sha]=${{ steps.pr.outputs.head_sha }}" \
            -f "client_payload[command]=${{ steps.parse.outputs.command }}"

      - name: Comment on queued command
        if: >-
          steps.parse.outputs.skip != 'true' &&
          steps.parse.outputs.authorized == 'true' &&
          steps.pr.outputs.head_repo == github.repository &&
          steps.config.outputs.configured == 'true'
        run: |
          body_file="$(mktemp)"
          {
            echo "Queued \`pulumi ${{ steps.parse.outputs.command }}\` for \`${{ steps.pr.outputs.head_sha }}\`."
            echo
            echo "A trusted \`repository_dispatch\` runner workflow will execute the command and post the result back to this pull request."
          } > "${body_file}"
          gh pr comment ${{ github.event.issue.number }} --body-file "${body_file}"
