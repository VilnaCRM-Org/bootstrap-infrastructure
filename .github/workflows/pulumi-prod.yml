name: Pulumi Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA to preview and release
        required: true
        type: string

concurrency:
  group: bootstrap-infrastructure-prod-state
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  actions: read
  contents: read

jobs:
  preview:
    name: Prod Preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: prod-preview
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      preview_sha: ${{ steps.resolve_sha.outputs.preview_sha }}
    env:
      PULUMI_SKIP_UPDATE_CHECK: "true"
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      AWS_PREVIEW_ROLE_ARN: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
      AWS_DRIFT_ROLE_ARN: ${{ vars.AWS_DRIFT_ROLE_ARN }}
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
      PULUMI_SECRETS_PROVIDER: ${{ vars.PULUMI_SECRETS_PROVIDER }}
      PULUMI_PREVIEW_STACKS: ${{ vars.PULUMI_PREVIEW_STACKS }}
      PULUMI_DRIFT_STACKS: ${{ vars.PULUMI_DRIFT_STACKS }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Resolve preview SHA
        id: resolve_sha
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          preview_sha="$(git rev-parse HEAD)"
          if [[ ! "${REQUESTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "error: production releases require a full 40-character commit SHA." >&2
            exit 1
          fi
          if [[ "${REQUESTED_SHA}" != "${preview_sha}" ]]; then
            echo "error: requested SHA does not match checked-out preview SHA." >&2
            exit 1
          fi
          echo "preview_sha=${preview_sha}" >> "${GITHUB_OUTPUT}"

      - name: Verify test deployment succeeded for SHA
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.resolve_sha.outputs.preview_sha }}
        run: |
          mapfile -t run_ids < <(
            gh api \
              --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/pulumi-test-deploy.yml/runs?head_sha=${TARGET_SHA}&status=completed&per_page=100" \
              --jq '.workflow_runs[] | select(.conclusion == "success" and .head_branch == "main") | .id'
          )
          run_id="${run_ids[0]:-}"
          if [[ -z "${run_id}" ]]; then
            echo "error: commit ${TARGET_SHA} has no successful Pulumi Test Deploy run on main." >&2
            exit 1
          fi
          echo "Pulumi Test Deploy run: ${run_id}"

      - name: Validate production preview prerequisites
        run: |
          missing=()
          for name in \
            AWS_ACCOUNT_ID \
            AWS_PREVIEW_ROLE_ARN \
            AWS_DRIFT_ROLE_ARN \
            PULUMI_BACKEND_URL \
            PULUMI_SECRETS_PROVIDER \
            PULUMI_PREVIEW_STACKS \
            PULUMI_DRIFT_STACKS; do
            if [[ -z "${!name}" ]]; then
              missing+=("${name}")
            fi
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            printf 'error: production preview is missing %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if [[ ! "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]; then
            echo "error: AWS_ACCOUNT_ID must be a 12-digit AWS account ID." >&2
            exit 1
          fi
          if [[ "${PULUMI_BACKEND_URL}" != s3://* ]]; then
            echo "error: PULUMI_BACKEND_URL must use an s3:// backend." >&2
            exit 1
          fi
          if [[ "${PULUMI_SECRETS_PROVIDER}" != awskms://* ]]; then
            echo "error: PULUMI_SECRETS_PROVIDER must use an awskms:// URI." >&2
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: ${{ env.AWS_PREVIEW_ROLE_ARN }}
          role-session-name: gha-prod-preview-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Emit production preview evidence
        env:
          PREVIEW_SHA: ${{ steps.resolve_sha.outputs.preview_sha }}
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "GitHub environment: prod-preview"
          echo "Commit SHA: ${PREVIEW_SHA}"
          echo "AWS account ID: ${account_id}"
          echo "Pulumi stacks: ${PULUMI_PREVIEW_STACKS}"
          echo "Role purpose: preview"

      - name: Start development environment
        run: make start

      - name: Save production update plan and preview artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make pulumi-plan

      - name: Upload preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prod-pulumi-preview
          path: .artifacts/pulumi-preview
          retention-days: 7

      - name: Upload plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prod-pulumi-plan
          path: .artifacts/pulumi-plan
          retention-days: 7

  destructive_diff:
    name: Prod Destructive Diff Gate
    runs-on: ubuntu-latest
    needs:
      - preview
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.preview.outputs.preview_sha }}
          persist-credentials: false

      - name: Start development environment
        run: make start

      - name: Download preview artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: prod-pulumi-preview
          path: .artifacts/pulumi-preview

      - name: Enforce destructive diff gate
        run: make test-destructive-diff

  iam_validation:
    name: Prod IAM Validation
    runs-on: ubuntu-latest
    needs:
      - preview
    timeout-minutes: 15
    environment: prod-preview
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_SKIP_UPDATE_CHECK: "true"
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      AWS_PREVIEW_ROLE_ARN: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
      PULUMI_SECRETS_PROVIDER: ${{ vars.PULUMI_SECRETS_PROVIDER }}
      PULUMI_PREVIEW_STACKS: ${{ vars.PULUMI_PREVIEW_STACKS }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.preview.outputs.preview_sha }}
          persist-credentials: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: ${{ env.AWS_PREVIEW_ROLE_ARN }}
          role-session-name: gha-prod-iam-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Start development environment
        run: make start

      - name: Download preview artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: prod-pulumi-preview
          path: .artifacts/pulumi-preview

      - name: Validate IAM policies
        run: make test-iam-validation

  apply:
    name: Prod Apply
    runs-on: ubuntu-latest
    needs:
      - destructive_diff
      - iam_validation
      - preview
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_SKIP_UPDATE_CHECK: "true"
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      AWS_APPLY_ROLE_ARN: ${{ vars.AWS_APPLY_ROLE_ARN }}
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
      PULUMI_SECRETS_PROVIDER: ${{ vars.PULUMI_SECRETS_PROVIDER }}
      PULUMI_PREVIEW_STACKS: ${{ vars.PULUMI_PREVIEW_STACKS }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.preview.outputs.preview_sha }}
          persist-credentials: false

      - name: Verify approved commit SHA
        env:
          PREVIEW_SHA: ${{ needs.preview.outputs.preview_sha }}
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          if [[ "${REQUESTED_SHA}" != "${PREVIEW_SHA}" ]]; then
            echo "error: approved workflow input SHA does not match production preview SHA" >&2
            exit 1
          fi
          echo "Approved production SHA: ${PREVIEW_SHA}"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: ${{ env.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-prod-apply-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Emit production apply evidence
        env:
          PREVIEW_SHA: ${{ needs.preview.outputs.preview_sha }}
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "GitHub environment: prod"
          echo "Commit SHA: ${PREVIEW_SHA}"
          echo "AWS account ID: ${account_id}"
          echo "Pulumi stacks: ${PULUMI_PREVIEW_STACKS}"
          echo "Role purpose: apply"

      - name: Start development environment
        run: make start

      - name: Download plan artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: prod-pulumi-plan
          path: .artifacts/pulumi-plan

      - name: Apply saved production plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make pulumi-up-plan

  post_apply_drift:
    name: Prod Post-Apply Drift
    runs-on: ubuntu-latest
    needs:
      - apply
      - preview
    timeout-minutes: 20
    environment: prod-preview
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_SKIP_UPDATE_CHECK: "true"
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      AWS_DRIFT_ROLE_ARN: ${{ vars.AWS_DRIFT_ROLE_ARN }}
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
      PULUMI_SECRETS_PROVIDER: ${{ vars.PULUMI_SECRETS_PROVIDER }}
      PULUMI_DRIFT_STACKS: ${{ vars.PULUMI_DRIFT_STACKS }}
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.preview.outputs.preview_sha }}
          persist-credentials: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: ${{ env.AWS_DRIFT_ROLE_ARN }}
          role-session-name: gha-prod-drift-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Start development environment
        run: make start

      - name: Run production drift detection
        run: make test-drift
