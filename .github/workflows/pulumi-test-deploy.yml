name: Pulumi Test Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: bootstrap-infrastructure-test-state
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  preview:
    name: Test Preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_SKIP_UPDATE_CHECK: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Load test AWS CI configuration
        id: ci_config
        uses: ./.github/actions/load-aws-ci-env
        with:
          environment: test
          config-role-arn: ${{ vars.AWS_TEST_CI_CONFIG_ROLE_ARN }}
          expected-account-id: ${{ vars.AWS_TEST_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_TEST_REGION }}
          purpose: test preview
          required-keys: >-
            AWS_ACCOUNT_ID,AWS_REGION,AWS_PREVIEW_ROLE_ARN,AWS_APPLY_ROLE_ARN,
            AWS_DRIFT_ROLE_ARN,PULUMI_BACKEND_URL,PULUMI_SECRETS_PROVIDER,
            PULUMI_PREVIEW_STACKS,PULUMI_DRIFT_STACKS

      - name: Validate test deployment prerequisites
        run: |
          missing=()
          for name in \
            AWS_ACCOUNT_ID \
            AWS_PREVIEW_ROLE_ARN \
            AWS_APPLY_ROLE_ARN \
            AWS_DRIFT_ROLE_ARN \
            PULUMI_BACKEND_URL \
            PULUMI_SECRETS_PROVIDER \
            PULUMI_PREVIEW_STACKS \
            PULUMI_DRIFT_STACKS; do
            if [[ -z "${!name}" ]]; then
              missing+=("${name}")
            fi
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            printf 'error: test deployment is missing %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if [[ ! "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]; then
            echo "error: AWS_ACCOUNT_ID must be a 12-digit AWS account ID." >&2
            exit 1
          fi
          if [[ "${PULUMI_BACKEND_URL}" != s3://* ]]; then
            echo "error: PULUMI_BACKEND_URL must use an s3:// backend." >&2
            exit 1
          fi
          if [[ "${PULUMI_SECRETS_PROVIDER}" != awskms://* ]]; then
            echo "error: PULUMI_SECRETS_PROVIDER must use an awskms:// URI." >&2
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: ${{ steps.ci_config.outputs.aws-preview-role-arn }}
          role-session-name: gha-test-preflight-${{ github.run_id }}
          aws-region: ${{ steps.ci_config.outputs.aws-region }}
          allowed-account-ids: ${{ steps.ci_config.outputs.aws-account-id }}

      - name: Emit test preview evidence
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "CI config secret: ${CI_CONFIG_SECRET_ID}"
          echo "Backend type: s3"
          echo "Commit SHA: ${GITHUB_SHA}"
          echo "Expected AWS account ID: ${AWS_ACCOUNT_ID}"
          echo "Current AWS account ID: ${account_id}"
          echo "Pulumi stacks: ${PULUMI_PREVIEW_STACKS}"
          echo "Role purpose: preview"

      - name: Start development environment
        run: make start

      - name: Save test update plan and preview artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULUMI_COMMIT_SHA: ${{ github.sha }}
        run: make pulumi-plan

      - name: Upload preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-pulumi-preview
          path: .artifacts/pulumi-preview
          retention-days: 7

      - name: Upload plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-pulumi-plan
          path: .artifacts/pulumi-plan
          retention-days: 7

  destructive_diff:
    name: Test Destructive Diff Gate
    runs-on: ubuntu-latest
    needs:
      - preview
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Start development environment
        run: make start

      - name: Download preview artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: test-pulumi-preview
          path: .artifacts/pulumi-preview

      - name: Enforce destructive diff gate
        run: make test-destructive-diff

  iam_validation:
    name: Test IAM Validation
    runs-on: ubuntu-latest
    needs:
      - preview
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_SKIP_UPDATE_CHECK: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Load test AWS CI configuration
        id: ci_config
        uses: ./.github/actions/load-aws-ci-env
        with:
          environment: test
          config-role-arn: ${{ vars.AWS_TEST_CI_CONFIG_ROLE_ARN }}
          expected-account-id: ${{ vars.AWS_TEST_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_TEST_REGION }}
          purpose: test IAM validation
          required-keys: >-
            AWS_ACCOUNT_ID,AWS_REGION,AWS_PREVIEW_ROLE_ARN,
            PULUMI_BACKEND_URL,PULUMI_SECRETS_PROVIDER,PULUMI_PREVIEW_STACKS

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: ${{ steps.ci_config.outputs.aws-preview-role-arn }}
          role-session-name: gha-test-iam-${{ github.run_id }}
          aws-region: ${{ steps.ci_config.outputs.aws-region }}
          allowed-account-ids: ${{ steps.ci_config.outputs.aws-account-id }}

      - name: Start development environment
        run: make start

      - name: Download preview artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: test-pulumi-preview
          path: .artifacts/pulumi-preview

      - name: Validate IAM policies
        run: make test-iam-validation

  apply:
    name: Test Apply
    environment: test
    runs-on: ubuntu-latest
    needs:
      - destructive_diff
      - iam_validation
      - preview
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_SKIP_UPDATE_CHECK: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Load test AWS CI configuration
        id: ci_config
        uses: ./.github/actions/load-aws-ci-env
        with:
          environment: test
          config-role-arn: ${{ vars.AWS_TEST_CI_CONFIG_ROLE_ARN }}
          expected-account-id: ${{ vars.AWS_TEST_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_TEST_REGION }}
          purpose: test apply
          required-keys: >-
            AWS_ACCOUNT_ID,AWS_REGION,AWS_APPLY_ROLE_ARN,
            PULUMI_BACKEND_URL,PULUMI_SECRETS_PROVIDER,PULUMI_PREVIEW_STACKS

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: ${{ steps.ci_config.outputs.aws-apply-role-arn }}
          role-session-name: gha-test-apply-${{ github.run_id }}
          aws-region: ${{ steps.ci_config.outputs.aws-region }}
          allowed-account-ids: ${{ steps.ci_config.outputs.aws-account-id }}

      - name: Emit test apply evidence
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "CI config secret: ${CI_CONFIG_SECRET_ID}"
          echo "Backend type: s3"
          echo "Commit SHA: ${GITHUB_SHA}"
          echo "Expected AWS account ID: ${AWS_ACCOUNT_ID}"
          echo "Current AWS account ID: ${account_id}"
          echo "Pulumi stacks: ${PULUMI_PREVIEW_STACKS}"
          echo "Role purpose: apply"

      - name: Start development environment
        run: make start

      - name: Download plan artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: test-pulumi-plan
          path: .artifacts/pulumi-plan

      - name: Apply saved test plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULUMI_EXPECTED_SHA: ${{ github.sha }}
        run: make pulumi-up-plan

  post_apply_drift:
    name: Test Post-Apply Drift
    runs-on: ubuntu-latest
    needs:
      - apply
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      PULUMI_SKIP_UPDATE_CHECK: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Load test AWS CI configuration
        id: ci_config
        uses: ./.github/actions/load-aws-ci-env
        with:
          environment: test
          config-role-arn: ${{ vars.AWS_TEST_CI_CONFIG_ROLE_ARN }}
          expected-account-id: ${{ vars.AWS_TEST_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_TEST_REGION }}
          purpose: test drift
          required-keys: >-
            AWS_ACCOUNT_ID,AWS_REGION,AWS_DRIFT_ROLE_ARN,
            PULUMI_BACKEND_URL,PULUMI_SECRETS_PROVIDER,PULUMI_DRIFT_STACKS

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: ${{ steps.ci_config.outputs.aws-drift-role-arn }}
          role-session-name: gha-test-drift-${{ github.run_id }}
          aws-region: ${{ steps.ci_config.outputs.aws-region }}
          allowed-account-ids: ${{ steps.ci_config.outputs.aws-account-id }}

      - name: Start development environment
        run: make start

      - name: Run post-apply drift detection
        run: make test-drift
