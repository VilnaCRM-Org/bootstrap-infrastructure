name: Load ESC CI environment
description: Authenticate to Pulumi ESC, load fixed environment variables, and validate them.

inputs:
  environment:
    description: Fixed Pulumi ESC environment suffix to open.
    required: true
  purpose:
    description: Human-readable role purpose used in validation evidence.
    required: true
  required-keys:
    description: Comma-separated ESC environmentVariables keys required by the job.
    required: true

outputs:
  aws-account-id:
    description: Expected AWS account ID from ESC.
    value: ${{ steps.collect.outputs.aws_account_id }}
  aws-region:
    description: AWS region from ESC.
    value: ${{ steps.collect.outputs.aws_region }}
  aws-preview-role-arn:
    description: Preview role ARN from ESC when requested.
    value: ${{ steps.collect.outputs.aws_preview_role_arn }}
  aws-apply-role-arn:
    description: Apply role ARN from ESC when requested.
    value: ${{ steps.collect.outputs.aws_apply_role_arn }}
  aws-drift-role-arn:
    description: Drift role ARN from ESC when requested.
    value: ${{ steps.collect.outputs.aws_drift_role_arn }}
  aws-operations-alert-triage-role-arn:
    description: Operations alert triage role ARN from ESC when requested.
    value: ${{ steps.collect.outputs.aws_operations_alert_triage_role_arn }}

runs:
  using: composite
  steps:
    - name: Resolve ESC target
      id: esc-target
      shell: bash
      env:
        PULUMI_ESC_ENVIRONMENT_SUFFIX: ${{ inputs.environment }}
      run: |
        python3 - <<'PY'
        import json
        import os
        import re
        from pathlib import Path

        config = json.loads(Path(".github/ci/pulumi-esc.json").read_text(encoding="utf-8"))
        allowed_keys = {"organization", "project"}
        if not isinstance(config, dict) or set(config) != allowed_keys:
            raise SystemExit(
                "error: .github/ci/pulumi-esc.json may contain only "
                "organization and project. Keep account-local values in "
                "AWS Secrets Manager."
            )
        organization = str(config.get("organization", "")).strip()
        project = str(config.get("project", "")).strip()
        suffix = os.environ["PULUMI_ESC_ENVIRONMENT_SUFFIX"].strip()
        slug_pattern = re.compile(r"^[a-z0-9][a-z0-9-]*$")
        for label, value in {
            "organization": organization,
            "project": project,
            "environment": suffix,
        }.items():
            if not slug_pattern.fullmatch(value):
                raise SystemExit(
                    f"error: Pulumi ESC {label} must be a lowercase slug without slashes."
                )
        output_path = Path(os.environ["GITHUB_OUTPUT"])
        with output_path.open("a", encoding="utf-8") as output:
            output.write(f"organization={organization}\n")
            output.write(f"environment={organization}/{project}/{suffix}\n")
        PY

    - name: Record AWS Secrets Manager source-of-truth boundary
      shell: bash
      env:
        PULUMI_ESC_ENVIRONMENT: ${{ steps.esc-target.outputs.environment }}
      run: |
        echo "::notice title=AWS Secrets Manager source of truth::Opening ${PULUMI_ESC_ENVIRONMENT}; AWS Secrets Manager remains the source of truth, while ESC projects values through aws-secrets."
        echo "::notice title=ESC manual setup::If Pulumi auth reports invalid organization, update .github/ci/pulumi-esc.json through review or configure GitHub-to-ESC OIDC for the real organization before rerunning privileged checks."
        if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
          {
            echo "### Pulumi ESC CI target"
            echo ""
            echo "- ESC environment: \`${PULUMI_ESC_ENVIRONMENT}\`"
            echo "- Source of truth: AWS Secrets Manager JSON imported through \`aws-secrets\`"
            echo "- Pre-auth status: no ESC values or AWS credentials have been loaded yet"
            echo ""
            echo "If Pulumi auth reports invalid organization, update \`.github/ci/pulumi-esc.json\` through review or configure GitHub-to-ESC OIDC for the real organization before rerunning privileged checks."
          } >> "${GITHUB_STEP_SUMMARY}"
        fi

    - name: Authenticate with Pulumi ESC
      uses: pulumi/auth-actions@1c89817aab0c66407723cdef72b05266e7376640
      with:
        organization: ${{ steps.esc-target.outputs.organization }}
        requested-token-type: urn:pulumi:token-type:access_token:organization

    - name: Load ESC environment variables
      uses: pulumi/esc-action@6cf9520e68354d86f81c455e8d43eabd58f5c9f5
      with:
        environment: ${{ steps.esc-target.outputs.environment }}
        keys: ${{ inputs.required-keys }}
        export-environment-variables: "true"

    - name: Install uv for ESC validation
      shell: bash
      run: |
        python3 -m pip install --user 'uv==0.9.21'
        echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

    - name: Validate ESC configuration
      shell: bash
      env:
        PULUMI_ESC_ENVIRONMENT: ${{ steps.esc-target.outputs.environment }}
      run: |
        echo "PULUMI_ESC_ENVIRONMENT=${PULUMI_ESC_ENVIRONMENT}" >> "${GITHUB_ENV}"
        uv run python scripts/validate_ci_environment.py \
          --purpose "${{ inputs.purpose }}" \
          --required-keys "${{ inputs.required-keys }}"

    - name: Collect AWS outputs
      id: collect
      shell: bash
      run: |
        {
          echo "aws_account_id=${AWS_ACCOUNT_ID:-}"
          echo "aws_region=${AWS_REGION:-}"
          echo "aws_preview_role_arn=${AWS_PREVIEW_ROLE_ARN:-}"
          echo "aws_apply_role_arn=${AWS_APPLY_ROLE_ARN:-}"
          echo "aws_drift_role_arn=${AWS_DRIFT_ROLE_ARN:-}"
          echo "aws_operations_alert_triage_role_arn=${AWS_OPERATIONS_ALERT_TRIAGE_ROLE_ARN:-}"
        } >> "${GITHUB_OUTPUT}"
