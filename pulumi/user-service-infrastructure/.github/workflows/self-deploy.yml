# Governed roles: GitHubCiApply-user-service-infrastructure-test
# Config reader: GitHubCiConfigRead-user-service-infrastructure-test
name: Service Self Deploy

on:
  repository_dispatch:
    types:
      - pulumi-pr-command

concurrency:
  group: pulumi-command-${{ github.event.client_payload.pull_request_number || github.event_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  preflight:
    if: github.event_name == 'repository_dispatch'
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      statuses: write
    outputs:
      command: ${{ steps.resolve.outputs.command }}
      display_command: ${{ steps.resolve.outputs.display_command }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      source_run_id: ${{ steps.resolve.outputs.source_run_id }}
      comment_id: ${{ steps.resolve.outputs.comment_id }}
      pull_request_number: ${{ steps.resolve.outputs.pull_request_number }}
      target_environment: ${{ steps.resolve.outputs.target_environment }}
    env:
      GH_TOKEN: ${{ github.token }}
      REQUEST_COMMAND: ${{ github.event.client_payload.command }}
      REQUEST_HEAD_SHA: ${{ github.event.client_payload.head_sha }}
      REQUEST_PULL_REQUEST_NUMBER: ${{ github.event.client_payload.pull_request_number }}
      REQUEST_COMMENT_ID: ${{ github.event.client_payload.comment_id }}
      REQUEST_SOURCE_RUN_ID: ${{ github.event.client_payload.source_run_id }}
      REQUEST_TARGET_ENVIRONMENT: ${{ github.event.client_payload.target_environment }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Authenticate immutable intake request and consume comment
        id: resolve
        run: python3 scripts/pulumi_command_preflight.py --service

  test_preview:
    name: Test Preview
    environment: test-preview
    runs-on: ubuntu-latest
    needs:
      - preflight
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    env:
      PULUMI_SKIP_UPDATE_CHECK: "true"
    concurrency:
      group: pulumi-state-${{ github.repository }}-test-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          persist-credentials: false

      - name: Check out trusted credential helper
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: .trusted
          persist-credentials: false

      - name: Recheck current PR head before credentials
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          PR_NUMBER: ${{ needs.preflight.outputs.pull_request_number }}
        run: |
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r '.state' <<< "${pr_json}")" = open
          test "$(jq -r '.merged' <<< "${pr_json}")" = false
          test "$(jq -r '.head.sha' <<< "${pr_json}")" = "${EXPECTED_SHA}"
          test "$(jq -r '.base.ref' <<< "${pr_json}")" = main
          test "$(jq -r '.base.sha' <<< "${pr_json}")" = "${EXPECTED_BASE_SHA}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Load test AWS CI configuration
        id: ci_config
        uses: ./.trusted/.github/actions/load-aws-ci-env
        with:
          environment: test
          config-role-arn: ${{ vars.AWS_TEST_CI_CONFIG_ROLE_ARN }}
          expected-account-id: ${{ vars.AWS_TEST_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_TEST_REGION }}
          purpose: PR test preview
          required-keys: >-
            AWS_ACCOUNT_ID,AWS_REGION,AWS_PREVIEW_ROLE_ARN,
            PULUMI_BACKEND_URL,PULUMI_SECRETS_PROVIDER,PULUMI_PREVIEW_STACKS

      - name: Validate test preview prerequisites
        run: |
          missing=()
          for name in \
            AWS_ACCOUNT_ID \
            AWS_PREVIEW_ROLE_ARN \
            PULUMI_BACKEND_URL \
            PULUMI_SECRETS_PROVIDER \
            PULUMI_PREVIEW_STACKS; do
            if [[ -z "${!name}" ]]; then
              missing+=("${name}")
            fi
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            printf 'error: PR test preview is missing %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if [[ ! "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]; then
            echo "error: AWS_ACCOUNT_ID must be a 12-digit AWS account ID." >&2
            exit 1
          fi
          if [[ "${PULUMI_BACKEND_URL}" != s3://* ]]; then
            echo "error: PULUMI_BACKEND_URL must use an s3:// backend." >&2
            exit 1
          fi
          if [[ "${PULUMI_SECRETS_PROVIDER}" != awskms://* ]]; then
            echo "error: PULUMI_SECRETS_PROVIDER must use an awskms:// URI." >&2
            exit 1
          fi

      - name: Configure AWS preview credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: ${{ steps.ci_config.outputs.aws-preview-role-arn }}
          role-session-name: gha-pr-test-preview-${{ github.run_id }}
          aws-region: ${{ steps.ci_config.outputs.aws-region }}
          allowed-account-ids: ${{ vars.AWS_TEST_ACCOUNT_ID }}

      - name: Emit test preview evidence
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "CI config secret: ${CI_CONFIG_SECRET_ID}"
          echo "Backend type: s3"
          echo "Commit SHA: ${{ needs.preflight.outputs.head_sha }}"
          echo "Expected AWS account ID: ${AWS_ACCOUNT_ID}"
          echo "Current AWS account ID: ${account_id}"
          echo "Pulumi stacks: ${PULUMI_PREVIEW_STACKS}"
          echo "Role purpose: preview"
          echo "PR command: ${{ needs.preflight.outputs.display_command }}"

      - name: Start development environment
        run: make start

      - name: Save test update plan and preview artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULUMI_COMMIT_SHA: ${{ needs.preflight.outputs.head_sha }}
        run: make pulumi-plan

      - name: Upload test preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: >-
            pr-command-${{ needs.preflight.outputs.pull_request_number }}-${{
            needs.preflight.outputs.head_sha }}-test-preview
          path: .artifacts/pulumi-preview
          retention-days: 7

      - name: Upload test plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: >-
            pr-command-${{ needs.preflight.outputs.pull_request_number }}-${{
            needs.preflight.outputs.head_sha }}-test-plan
          path: .artifacts/pulumi-plan
          retention-days: 7

  test_destructive_diff:
    name: Test Destructive Diff Gate
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    needs:
      - preflight
      - test_preview
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          persist-credentials: false

      - name: Start development environment
        run: make start

      - name: Download test preview artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: >-
            pr-command-${{ needs.preflight.outputs.pull_request_number }}-${{
            needs.preflight.outputs.head_sha }}-test-preview
          path: .artifacts/pulumi-preview

      - name: Stage pull request labels for destructive diff override
        run: |
          mkdir -p .artifacts/pulumi-preview
          labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${{ needs.preflight.outputs.pull_request_number }}/labels" --paginate --slurp | jq '[.[][] | {name: .name}]')"
          printf '{"pull_request":{"labels":%s}}\n' "${labels}" > .artifacts/pulumi-preview/pull-request-event.json

      - name: Enforce destructive diff gate
        run: make test-destructive-diff

  test_apply:
    name: Test Apply
    if: >-
      needs.preflight.outputs.command == 'up'
    environment: test
    runs-on: ubuntu-latest
    needs:
      - preflight
      - test_preview
      - test_destructive_diff
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    env:
      PULUMI_SKIP_UPDATE_CHECK: "true"
    concurrency:
      group: pulumi-state-${{ github.repository }}-test-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          persist-credentials: false

      - name: Check out trusted credential helper
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: .trusted
          persist-credentials: false

      - name: Recheck current PR head before credentials
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          PR_NUMBER: ${{ needs.preflight.outputs.pull_request_number }}
        run: |
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r '.state' <<< "${pr_json}")" = open
          test "$(jq -r '.merged' <<< "${pr_json}")" = false
          test "$(jq -r '.head.sha' <<< "${pr_json}")" = "${EXPECTED_SHA}"
          test "$(jq -r '.base.ref' <<< "${pr_json}")" = main
          test "$(jq -r '.base.sha' <<< "${pr_json}")" = "${EXPECTED_BASE_SHA}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Load test AWS CI configuration
        id: ci_config
        uses: ./.trusted/.github/actions/load-aws-ci-env
        with:
          environment: test
          config-role-arn: ${{ vars.AWS_TEST_CI_CONFIG_ROLE_ARN }}
          expected-account-id: ${{ vars.AWS_TEST_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_TEST_REGION }}
          purpose: PR test apply
          required-keys: >-
            AWS_ACCOUNT_ID,AWS_REGION,AWS_APPLY_ROLE_ARN,
            PULUMI_BACKEND_URL,PULUMI_SECRETS_PROVIDER,PULUMI_PREVIEW_STACKS

      - name: Configure AWS apply credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: ${{ steps.ci_config.outputs.aws-apply-role-arn }}
          role-session-name: gha-pr-test-apply-${{ github.run_id }}
          aws-region: ${{ steps.ci_config.outputs.aws-region }}
          allowed-account-ids: ${{ vars.AWS_TEST_ACCOUNT_ID }}

      - name: Emit test apply evidence
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "CI config secret: ${CI_CONFIG_SECRET_ID}"
          echo "Backend type: s3"
          echo "Commit SHA: ${{ needs.preflight.outputs.head_sha }}"
          echo "Expected AWS account ID: ${AWS_ACCOUNT_ID}"
          echo "Current AWS account ID: ${account_id}"
          echo "Pulumi stacks: ${PULUMI_PREVIEW_STACKS}"
          echo "Role purpose: apply"
          echo "PR command: ${{ needs.preflight.outputs.display_command }}"

      - name: Start development environment
        run: make start

      - name: Download test plan artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: >-
            pr-command-${{ needs.preflight.outputs.pull_request_number }}-${{
            needs.preflight.outputs.head_sha }}-test-plan
          path: .artifacts/pulumi-plan

      - name: Download test preview for apply revalidation
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: >-
            pr-command-${{ needs.preflight.outputs.pull_request_number }}-${{
            needs.preflight.outputs.head_sha }}-test-preview
          path: .artifacts/pulumi-preview

      - name: Apply saved test plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.preflight.outputs.pull_request_number }}
          GITHUB_TOKEN: ${{ github.token }}
          PULUMI_EXPECTED_SHA: ${{ needs.preflight.outputs.head_sha }}
        run: |
          # The immutable same-run preview is the diff for this saved plan.
          shopt -s nullglob
          previews=(.artifacts/pulumi-preview/*.json)
          found_preview=false
          for preview in "${previews[@]}"; do
            if [[ "${preview}" != */pull-request-event.json ]]; then
              test -s "${preview}"
              found_preview=true
            fi
          done
          test "${found_preview}" = true
          labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --paginate --slurp | jq '[.[][] | {name: .name}]')"
          printf '{"pull_request":{"labels":%s}}\n' "${labels}" > .artifacts/github-event.json
          # Remove only obsolete event metadata; preserve the original diff files.
          rm -f .artifacts/pulumi-preview/pull-request-event.json
          make test-destructive-diff
          make pulumi-up-plan

  test_post_apply_drift:
    name: Test Post-Apply Drift
    if: >-
      needs.preflight.outputs.command == 'up'
    environment: test-preview
    runs-on: ubuntu-latest
    needs:
      - preflight
      - test_apply
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    env:
      PULUMI_SKIP_UPDATE_CHECK: "true"
    concurrency:
      group: pulumi-state-${{ github.repository }}-test-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          persist-credentials: false

      - name: Check out trusted credential helper
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: .trusted
          persist-credentials: false

      - name: Recheck current PR head before credentials
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          PR_NUMBER: ${{ needs.preflight.outputs.pull_request_number }}
        run: |
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r '.state' <<< "${pr_json}")" = open
          test "$(jq -r '.merged' <<< "${pr_json}")" = false
          test "$(jq -r '.head.sha' <<< "${pr_json}")" = "${EXPECTED_SHA}"
          test "$(jq -r '.base.ref' <<< "${pr_json}")" = main
          test "$(jq -r '.base.sha' <<< "${pr_json}")" = "${EXPECTED_BASE_SHA}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Load test AWS CI configuration
        id: ci_config
        uses: ./.trusted/.github/actions/load-aws-ci-env
        with:
          environment: test
          config-role-arn: ${{ vars.AWS_TEST_CI_CONFIG_ROLE_ARN }}
          expected-account-id: ${{ vars.AWS_TEST_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_TEST_REGION }}
          purpose: PR test drift
          required-keys: >-
            AWS_ACCOUNT_ID,AWS_REGION,AWS_DRIFT_ROLE_ARN,
            PULUMI_BACKEND_URL,PULUMI_SECRETS_PROVIDER,PULUMI_DRIFT_STACKS

      - name: Configure AWS drift credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: ${{ steps.ci_config.outputs.aws-drift-role-arn }}
          role-session-name: gha-pr-test-drift-${{ github.run_id }}
          aws-region: ${{ steps.ci_config.outputs.aws-region }}
          allowed-account-ids: ${{ vars.AWS_TEST_ACCOUNT_ID }}

      - name: Start development environment
        run: make start

      - name: Run test post-apply drift detection
        run: make test-drift

  prod_preview:
    name: Prod Preview
    if: >-
      always() && needs.preflight.result == 'success' &&
      needs.preflight.outputs.target_environment == 'prod' &&
      needs.test_preview.result == 'success' &&
      (needs.preflight.outputs.command == 'plan' ||
      needs.test_post_apply_drift.result == 'success')
    environment: prod-preview
    runs-on: ubuntu-latest
    needs:
      - preflight
      - test_preview
      - test_post_apply_drift
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    env:
      PULUMI_SKIP_UPDATE_CHECK: "true"
    concurrency:
      group: pulumi-state-${{ github.repository }}-prod-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          persist-credentials: false

      - name: Check out trusted credential helper
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: .trusted
          persist-credentials: false

      - name: Recheck current PR head before credentials
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          PR_NUMBER: ${{ needs.preflight.outputs.pull_request_number }}
        run: |
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r '.state' <<< "${pr_json}")" = open
          test "$(jq -r '.merged' <<< "${pr_json}")" = false
          test "$(jq -r '.head.sha' <<< "${pr_json}")" = "${EXPECTED_SHA}"
          test "$(jq -r '.base.ref' <<< "${pr_json}")" = main
          test "$(jq -r '.base.sha' <<< "${pr_json}")" = "${EXPECTED_BASE_SHA}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Load prod preview AWS CI configuration
        id: ci_config
        uses: ./.trusted/.github/actions/load-aws-ci-env
        with:
          environment: prod-preview
          config-role-arn: ${{ vars.AWS_PROD_PREVIEW_CI_CONFIG_ROLE_ARN }}
          expected-account-id: ${{ vars.AWS_PROD_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_PROD_REGION }}
          purpose: PR prod preview
          required-keys: >-
            AWS_ACCOUNT_ID,AWS_REGION,AWS_PREVIEW_ROLE_ARN,AWS_DRIFT_ROLE_ARN,
            PULUMI_BACKEND_URL,PULUMI_SECRETS_PROVIDER,
            PULUMI_PREVIEW_STACKS,PULUMI_DRIFT_STACKS

      - name: Validate production preview prerequisites
        run: |
          missing=()
          for name in \
            AWS_ACCOUNT_ID \
            AWS_PREVIEW_ROLE_ARN \
            AWS_DRIFT_ROLE_ARN \
            PULUMI_BACKEND_URL \
            PULUMI_SECRETS_PROVIDER \
            PULUMI_PREVIEW_STACKS \
            PULUMI_DRIFT_STACKS; do
            if [[ -z "${!name}" ]]; then
              missing+=("${name}")
            fi
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            printf 'error: PR production preview is missing %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if [[ ! "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]; then
            echo "error: AWS_ACCOUNT_ID must be a 12-digit AWS account ID." >&2
            exit 1
          fi
          if [[ "${PULUMI_BACKEND_URL}" != s3://* ]]; then
            echo "error: PULUMI_BACKEND_URL must use an s3:// backend." >&2
            exit 1
          fi
          if [[ "${PULUMI_SECRETS_PROVIDER}" != awskms://* ]]; then
            echo "error: PULUMI_SECRETS_PROVIDER must use an awskms:// URI." >&2
            exit 1
          fi

      - name: Configure AWS preview credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: ${{ steps.ci_config.outputs.aws-preview-role-arn }}
          role-session-name: gha-pr-prod-preview-${{ github.run_id }}
          aws-region: ${{ steps.ci_config.outputs.aws-region }}
          allowed-account-ids: ${{ vars.AWS_PROD_ACCOUNT_ID }}

      - name: Emit production preview evidence
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "CI config secret: ${CI_CONFIG_SECRET_ID}"
          echo "Backend type: s3"
          echo "Commit SHA: ${{ needs.preflight.outputs.head_sha }}"
          echo "Expected AWS account ID: ${AWS_ACCOUNT_ID}"
          echo "Current AWS account ID: ${account_id}"
          echo "Pulumi stacks: ${PULUMI_PREVIEW_STACKS}"
          echo "Role purpose: preview"
          echo "PR command: ${{ needs.preflight.outputs.display_command }}"

      - name: Start development environment
        run: make start

      - name: Save production update plan and preview artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULUMI_COMMIT_SHA: ${{ needs.preflight.outputs.head_sha }}
        run: make pulumi-plan

      - name: Upload production preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: >-
            pr-command-${{ needs.preflight.outputs.pull_request_number }}-${{
            needs.preflight.outputs.head_sha }}-prod-preview
          path: .artifacts/pulumi-preview
          retention-days: 7

      - name: Upload production plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: >-
            pr-command-${{ needs.preflight.outputs.pull_request_number }}-${{
            needs.preflight.outputs.head_sha }}-prod-plan
          path: .artifacts/pulumi-plan
          retention-days: 7

  prod_destructive_diff:
    name: Prod Destructive Diff Gate
    if: >-
      github.event_name == 'repository_dispatch' &&
      needs.preflight.outputs.target_environment == 'prod'
    runs-on: ubuntu-latest
    needs:
      - preflight
      - prod_preview
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          persist-credentials: false

      - name: Start development environment
        run: make start

      - name: Download production preview artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: >-
            pr-command-${{ needs.preflight.outputs.pull_request_number }}-${{
            needs.preflight.outputs.head_sha }}-prod-preview
          path: .artifacts/pulumi-preview

      - name: Stage pull request labels for destructive diff override
        run: |
          mkdir -p .artifacts/pulumi-preview
          labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${{ needs.preflight.outputs.pull_request_number }}/labels" --paginate --slurp | jq '[.[][] | {name: .name}]')"
          printf '{"pull_request":{"labels":%s}}\n' "${labels}" > .artifacts/pulumi-preview/pull-request-event.json

      - name: Enforce destructive diff gate
        run: make test-destructive-diff

  prod_apply:
    name: Prod Apply
    if: >-
      needs.preflight.outputs.target_environment == 'prod' &&
      needs.preflight.outputs.command == 'up'
    runs-on: ubuntu-latest
    needs:
      - preflight
      - test_apply
      - test_post_apply_drift
      - prod_preview
      - prod_destructive_diff
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    env:
      PULUMI_SKIP_UPDATE_CHECK: "true"
    concurrency:
      group: pulumi-state-${{ github.repository }}-prod-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          persist-credentials: false

      - name: Verify approved commit SHA
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          if [[ "${checked_out_sha}" != "${{ needs.preflight.outputs.head_sha }}" ]]; then
            echo "error: approved workflow SHA does not match checked-out production SHA" >&2
            exit 1
          fi
          echo "Approved production SHA: ${checked_out_sha}"

      - name: Check out trusted credential helper
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: .trusted
          persist-credentials: false

      - name: Recheck current PR head before credentials
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          PR_NUMBER: ${{ needs.preflight.outputs.pull_request_number }}
        run: |
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r '.state' <<< "${pr_json}")" = open
          test "$(jq -r '.merged' <<< "${pr_json}")" = false
          test "$(jq -r '.head.sha' <<< "${pr_json}")" = "${EXPECTED_SHA}"
          test "$(jq -r '.base.ref' <<< "${pr_json}")" = main
          test "$(jq -r '.base.sha' <<< "${pr_json}")" = "${EXPECTED_BASE_SHA}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Load prod AWS CI configuration
        id: ci_config
        uses: ./.trusted/.github/actions/load-aws-ci-env
        with:
          environment: prod
          config-role-arn: ${{ vars.AWS_PROD_CI_CONFIG_ROLE_ARN }}
          expected-account-id: ${{ vars.AWS_PROD_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_PROD_REGION }}
          purpose: PR prod apply
          required-keys: >-
            AWS_ACCOUNT_ID,AWS_REGION,AWS_APPLY_ROLE_ARN,
            PULUMI_BACKEND_URL,PULUMI_SECRETS_PROVIDER,PULUMI_PREVIEW_STACKS

      - name: Configure AWS apply credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: ${{ steps.ci_config.outputs.aws-apply-role-arn }}
          role-session-name: gha-pr-prod-apply-${{ github.run_id }}
          aws-region: ${{ steps.ci_config.outputs.aws-region }}
          allowed-account-ids: ${{ vars.AWS_PROD_ACCOUNT_ID }}

      - name: Emit production apply evidence
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "GitHub environment: prod"
          echo "CI config secret: ${CI_CONFIG_SECRET_ID}"
          echo "Backend type: s3"
          echo "Commit SHA: ${{ needs.preflight.outputs.head_sha }}"
          echo "Expected AWS account ID: ${AWS_ACCOUNT_ID}"
          echo "Current AWS account ID: ${account_id}"
          echo "Pulumi stacks: ${PULUMI_PREVIEW_STACKS}"
          echo "Role purpose: apply"
          echo "PR command: ${{ needs.preflight.outputs.display_command }}"

      - name: Start development environment
        run: make start

      - name: Download production plan artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: >-
            pr-command-${{ needs.preflight.outputs.pull_request_number }}-${{
            needs.preflight.outputs.head_sha }}-prod-plan
          path: .artifacts/pulumi-plan

      - name: Download production preview for apply revalidation
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: >-
            pr-command-${{ needs.preflight.outputs.pull_request_number }}-${{
            needs.preflight.outputs.head_sha }}-prod-preview
          path: .artifacts/pulumi-preview

      - name: Apply saved production plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.preflight.outputs.pull_request_number }}
          GITHUB_TOKEN: ${{ github.token }}
          PULUMI_EXPECTED_SHA: ${{ needs.preflight.outputs.head_sha }}
        run: |
          # The immutable same-run preview is the diff for this saved plan.
          shopt -s nullglob
          previews=(.artifacts/pulumi-preview/*.json)
          found_preview=false
          for preview in "${previews[@]}"; do
            if [[ "${preview}" != */pull-request-event.json ]]; then
              test -s "${preview}"
              found_preview=true
            fi
          done
          test "${found_preview}" = true
          labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --paginate --slurp | jq '[.[][] | {name: .name}]')"
          printf '{"pull_request":{"labels":%s}}\n' "${labels}" > .artifacts/github-event.json
          # Remove only obsolete event metadata; preserve the original diff files.
          rm -f .artifacts/pulumi-preview/pull-request-event.json
          make test-destructive-diff
          make pulumi-up-plan

  prod_post_apply_drift:
    name: Prod Post-Apply Drift
    if: >-
      needs.preflight.outputs.target_environment == 'prod' &&
      needs.preflight.outputs.command == 'up'
    environment: prod-preview
    runs-on: ubuntu-latest
    needs:
      - preflight
      - prod_apply
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    env:
      PULUMI_SKIP_UPDATE_CHECK: "true"
    concurrency:
      group: pulumi-state-${{ github.repository }}-prod-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          persist-credentials: false

      - name: Check out trusted credential helper
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          path: .trusted
          persist-credentials: false

      - name: Recheck current PR head before credentials
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.preflight.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          PR_NUMBER: ${{ needs.preflight.outputs.pull_request_number }}
        run: |
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r '.state' <<< "${pr_json}")" = open
          test "$(jq -r '.merged' <<< "${pr_json}")" = false
          test "$(jq -r '.head.sha' <<< "${pr_json}")" = "${EXPECTED_SHA}"
          test "$(jq -r '.base.ref' <<< "${pr_json}")" = main
          test "$(jq -r '.base.sha' <<< "${pr_json}")" = "${EXPECTED_BASE_SHA}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Load prod preview AWS CI configuration
        id: ci_config
        uses: ./.trusted/.github/actions/load-aws-ci-env
        with:
          environment: prod-preview
          config-role-arn: ${{ vars.AWS_PROD_PREVIEW_CI_CONFIG_ROLE_ARN }}
          expected-account-id: ${{ vars.AWS_PROD_ACCOUNT_ID }}
          aws-region: ${{ vars.AWS_PROD_REGION }}
          purpose: PR prod drift
          required-keys: >-
            AWS_ACCOUNT_ID,AWS_REGION,AWS_DRIFT_ROLE_ARN,
            PULUMI_BACKEND_URL,PULUMI_SECRETS_PROVIDER,PULUMI_DRIFT_STACKS

      - name: Configure AWS drift credentials via OIDC
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          role-to-assume: ${{ steps.ci_config.outputs.aws-drift-role-arn }}
          role-session-name: gha-pr-prod-drift-${{ github.run_id }}
          aws-region: ${{ steps.ci_config.outputs.aws-region }}
          allowed-account-ids: ${{ vars.AWS_PROD_ACCOUNT_ID }}

      - name: Start development environment
        run: make start

      - name: Run production post-apply drift detection
        run: make test-drift

  platform_promotion:
    concurrency:
      group: promotion-status-${{ needs.preflight.outputs.pull_request_number }}
      cancel-in-progress: false
    name: Publish Service Promotion Proof
    needs:
      - preflight
      - test_apply
      - test_post_apply_drift
      - prod_apply
      - prod_post_apply_drift
    if: >-
      needs.preflight.outputs.command == 'up' &&
      needs.preflight.outputs.target_environment == 'prod'
    environment: governance-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PROMOTION_KIND: service
      PROMOTION_NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download same-run test saved-plan proof
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: >-
            pr-command-${{ needs.preflight.outputs.pull_request_number }}-${{ needs.preflight.outputs.head_sha }}-test-plan
          path: .artifacts/promotion-inputs/test
      - name: Download same-run prod saved-plan proof
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: >-
            pr-command-${{ needs.preflight.outputs.pull_request_number }}-${{ needs.preflight.outputs.head_sha }}-prod-plan
          path: .artifacts/promotion-inputs/prod
      - name: Prepare verified promotion proof
        run: python3 scripts/governance_promotion.py prepare
      - name: Upload immutable promotion proof
        id: proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: governance-promotion
          path: .artifacts/governance-promotion/proof.json
          if-no-files-found: error
          retention-days: 90
      - name: Verify main-only App key boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/governance_promotion.py verify-environment
      - name: Create dedicated promotion App token
        id: promotion_app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.GOVERNANCE_PROMOTION_APP_ID }}
          private-key: ${{ secrets.GOVERNANCE_PROMOTION_APP_PRIVATE_KEY }}
          permission-statuses: write
          permission-deployments: write
          permission-actions: read
          permission-contents: read
          permission-pull-requests: read
      - name: Publish verified promotion and account deployment records
        env:
          GH_TOKEN: ${{ steps.promotion_app.outputs.token }}
          PROMOTION_ARTIFACT_ID: ${{ steps.proof.outputs.artifact-id }}
        run: python3 scripts/governance_promotion.py publish

  comment_result:
    name: Comment Result
    if: always()
    runs-on: ubuntu-latest
    needs:
      - preflight
      - platform_promotion
      - test_preview
      - test_destructive_diff
      - test_apply
      - test_post_apply_drift
      - prod_preview
      - prod_destructive_diff
      - prod_apply
      - prod_post_apply_drift
    timeout-minutes: 10
    permissions:
      issues: write
      # Result feedback is posted to the PR conversation; live QA showed
      # GitHub rejects this with only issues: write on the Actions token.
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Post PR command result
        run: |
          body_file="$(mktemp)"
          {
            echo "## Pulumi PR command result"
            echo
            echo "- Command: \`${{ needs.preflight.outputs.display_command || 'preflight' }}\`"
            echo "- Commit: \`${{ needs.preflight.outputs.head_sha || 'unknown' }}\`"
            echo "- Workflow run: ${RUN_URL}"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Preflight | \`${{ needs.preflight.result }}\` |"
            echo "| Test preview | \`${{ needs.test_preview.result }}\` |"
            echo "| Test destructive diff | \`${{ needs.test_destructive_diff.result }}\` |"
            echo "| Test apply | \`${{ needs.test_apply.result }}\` |"
            echo "| Test post-apply drift | \`${{ needs.test_post_apply_drift.result }}\` |"
            echo "| Production preview | \`${{ needs.prod_preview.result }}\` |"
            echo "| Production destructive diff | \`${{ needs.prod_destructive_diff.result }}\` |"
            echo "| Production apply | \`${{ needs.prod_apply.result }}\` |"
            echo "| Production post-apply drift | \`${{ needs.prod_post_apply_drift.result }}\` |"
            echo
            echo "Production stages are gated behind a successful test apply and test post-apply drift check for the same PR head SHA."
          } > "${body_file}"

          pr_number="${{ needs.preflight.outputs.pull_request_number }}"
          if [[ -n "${pr_number}" ]]; then
            jq -Rs '{body: .}' < "${body_file}" \
              | gh api \
                --method POST \
                "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/comments" \
                --input -
          else
            cat "${body_file}"
          fi
