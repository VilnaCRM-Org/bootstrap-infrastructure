# Initialize or migrate this stack with an AWS KMS secrets provider:
# pulumi -C pulumi stack init test --secrets-provider "awskms://alias/pulumi-platform-bootstrap-test?region=eu-central-1"
config:
  aws:region: eu-central-1
  bootstrap-infrastructure:githubOrg: VilnaCRM-Org
  bootstrap-infrastructure:repoSlug: bootstrap-infrastructure
  bootstrap-infrastructure:environment: test
  bootstrap-infrastructure:owner: platform
  bootstrap-infrastructure:costCenter: core
  bootstrap-infrastructure:githubBranch: main
  bootstrap-infrastructure:managedRepositories:
    - name: bootstrap-infrastructure
      defaultBranch: main
  bootstrap-infrastructure:githubOidcProviderArn: arn:aws:iam::891377212104:oidc-provider/token.actions.githubusercontent.com
